        // 复制当前周排课到指定周
        function copyToSpecifiedWeek() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            const targetMonthInput = document.getElementById('target-month');
            const targetWeekSelect = document.getElementById('target-week-select');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                alert('请先选择当前月份和周');
                closeModal();
                return;
            }
            
            if (!targetMonthInput || !targetWeekSelect || !targetMonthInput.value || !targetWeekSelect.value) {
                alert('请选择目标月份和周数');
                return;
            }
            
            const targetMonth = targetMonthInput.value;
            const targetWeek = targetWeekSelect.value;
            
            // 检查目标周是否存在
            const targetWeekRange = getSpecifiedWeekDateRange(targetMonth, targetWeek);
            if (!targetWeekRange) {
                alert(`目标月份 ${targetMonth} 的第${targetWeek}周不存在，请重新选择`);
                return;
            }
            
            closeModal();
            
            // 获取选中的课程复选框
            const checkedBoxes = document.querySelectorAll('.course-checkbox:checked');
            const selectedCourseIds = Array.from(checkedBoxes).map(cb => {
                const value = cb.value;
                const id = typeof value === 'string' ? parseInt(value, 10) : value;
                if (isNaN(id)) {
                    console.warn('无效的课程ID:', value);
                    return null;
                }
                return id;
            }).filter(id => id !== null);
            
            const currentWeek = getCurrentWeekDateRange();
            
            if (!currentWeek) {
                alert('无法计算当前周的日期范围');
                return;
            }
            
            // 获取当前周的排课数据
            const month = monthInput.value;
            const week = weekSelect.value;
            
            // 构建URL，包含筛选参数
            const params = [`month=${encodeURIComponent(month)}`, `week=${encodeURIComponent(week)}`];
            
            const filterTeacher = document.getElementById('filter-teacher');
            const filterClassroom = document.getElementById('filter-classroom');
            const filterSubject = document.getElementById('filter-subject');
            const filterGrade = document.getElementById('filter-grade');
            
            if (filterTeacher && filterTeacher.value) {
                params.push(`teacher=${encodeURIComponent(filterTeacher.value)}`);
            }
            if (filterClassroom && filterClassroom.value) {
                params.push(`classroom=${encodeURIComponent(filterClassroom.value)}`);
            }
            if (filterSubject && filterSubject.value) {
                params.push(`subject=${encodeURIComponent(filterSubject.value)}`);
            }
            if (filterGrade && filterGrade.value) {
                params.push(`grade=${encodeURIComponent(filterGrade.value)}`);
            }
            
            const url = `/api/courses?${params.join('&')}`;
            
            // 辅助函数：格式化日期为 YYYY-MM-DD
            function formatDate(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            
            // 同时获取当前周和目标周的排课数据
            Promise.all([
                fetch(url).then(res => res.json()),
                (() => {
                    // 构建目标周的URL，也包含筛选参数
                    const targetParams = [`month=${encodeURIComponent(targetMonth)}`, `week=${encodeURIComponent(targetWeek)}`];
                    if (filterTeacher && filterTeacher.value) {
                        targetParams.push(`teacher=${encodeURIComponent(filterTeacher.value)}`);
                    }
                    if (filterClassroom && filterClassroom.value) {
                        targetParams.push(`classroom=${encodeURIComponent(filterClassroom.value)}`);
                    }
                    if (filterSubject && filterSubject.value) {
                        targetParams.push(`subject=${encodeURIComponent(filterSubject.value)}`);
                    }
                    if (filterGrade && filterGrade.value) {
                        targetParams.push(`grade=${encodeURIComponent(filterGrade.value)}`);
                    }
                    
                    return fetch(`/api/courses?${targetParams.join('&')}`).then(res => res.json());
                })()
            ])
                .then(([courses, targetWeekCourses]) => {
                    // 过滤掉已删除的排课
                    let validCourses = courses.filter(c => c.status !== '删除');
                    
                    if (validCourses.length === 0) {
                        alert('当前周没有有效的排课数据。请确认：\n1. 当前周是否有排课\n2. 筛选条件是否正确\n3. 课程是否已被删除');
                        return;
                    }
                    
                    // 如果用户选中了课程，只保留选中的课程；否则使用所有有效课程
                    if (selectedCourseIds.length > 0) {
                        validCourses = validCourses.filter(c => {
                            const courseId = typeof c.id === 'string' ? parseInt(c.id) : c.id;
                            return selectedCourseIds.includes(courseId);
                        });
                        
                        if (validCourses.length === 0) {
                            alert('选中的课程中没有有效的排课数据。\n\n可能的原因：\n1. 选中的课程不在当前周内\n2. 选中的课程已被删除\n3. 选中的课程已被筛选条件过滤');
                            return;
                        }
                    }
                    
                    // 过滤掉目标周已删除的排课
                    const validTargetWeekCourses = targetWeekCourses.filter(c => c.status !== '删除');
                    
                    // 创建日期映射：当前周的日期 -> 目标周的对应日期（按星期匹配）
                    const dateMap = new Map();
                    
                    const currentStart = new Date(currentWeek.startDate.getFullYear(), currentWeek.startDate.getMonth(), currentWeek.startDate.getDate());
                    const currentEnd = new Date(currentWeek.endDate.getFullYear(), currentWeek.endDate.getMonth(), currentWeek.endDate.getDate());
                    const targetStart = new Date(targetWeekRange.startDate.getFullYear(), targetWeekRange.startDate.getMonth(), targetWeekRange.startDate.getDate());
                    const targetEnd = new Date(targetWeekRange.endDate.getFullYear(), targetWeekRange.endDate.getMonth(), targetWeekRange.endDate.getDate());
                    
                    // 按星期匹配：周一的课复制到目标周的周一，周二的课复制到目标周的周二，以此类推
                    let currentDate = new Date(currentStart);
                    const currentEndTime = currentEnd.getTime();
                    const targetStartTime = targetStart.getTime();
                    const targetEndTime = targetEnd.getTime();
                    
                    while (currentDate.getTime() <= currentEndTime) {
                        const currentWeekday = currentDate.getDay();
                        const currentDateStr = formatDate(currentDate);
                        
                        // 在目标周范围内找到相同星期的日期
                        let targetDate = null;
                        let checkDate = new Date(targetStart);
                        
                        while (checkDate.getTime() <= targetEndTime) {
                            if (checkDate.getDay() === currentWeekday) {
                                targetDate = new Date(checkDate);
                                break;
                            }
                            checkDate.setDate(checkDate.getDate() + 1);
                        }
                        
                        if (targetDate) {
                            const targetDateStr = formatDate(targetDate);
                            dateMap.set(currentDateStr, targetDateStr);
                        }
                        
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                    
                    if (dateMap.size === 0) {
                        alert('无法创建日期映射。当前周和目标周没有重叠的星期。');
                        return;
                    }
                    
                    // 创建目标周排课的唯一标识集合
                    const targetWeekCourseKeys = new Set();
                    validTargetWeekCourses.forEach(course => {
                        const dateStr = course.course_date;
                        const key = `${dateStr}|${course.student_name}|${course.subject}|${course.time_slot || ''}`;
                        targetWeekCourseKeys.add(key);
                    });
                    
                    // 过滤掉重复的课程
                    const processedKeys = new Set();
                    const coursesToCopy = validCourses.filter(course => {
                        const currentDateStr = course.course_date;
                        const targetDateStr = dateMap.get(currentDateStr);
                        
                        if (!targetDateStr) {
                            return false;
                        }
                        
                        const key = `${targetDateStr}|${course.student_name}|${course.subject}|${course.time_slot || ''}`;
                        
                        if (targetWeekCourseKeys.has(key)) {
                            return false;
                        }
                        
                        if (processedKeys.has(key)) {
                            return false;
                        }
                        
                        processedKeys.add(key);
                        return true;
                    });
                    
                    const skippedCount = validCourses.length - coursesToCopy.length;
                    
                    if (coursesToCopy.length === 0) {
                        alert('没有可复制的排课记录。\n\n所有排课记录都已存在于目标周，或没有匹配的日期。');
                        return;
                    }
                    
                    // 构建确认消息
                    const confirmMessage = `确定要将 ${coursesToCopy.length} 条排课复制到${targetWeekRange.year}年${targetWeekRange.month}月第${targetWeek}周吗？`;
                    
                    if (!confirm(confirmMessage)) {
                        return;
                    }
                    
                    // 批量创建排课
                    let successCount = 0;
                    let failCount = 0;
                    const failMessages = [];
                    
                    const promises = coursesToCopy.map(course => {
                        const currentDateStr = course.course_date;
                        const targetDateStr = dateMap.get(currentDateStr);
                        
                        if (!targetDateStr) {
                            const msg = `课程日期 ${currentDateStr} 没有找到对应的目标周日期`;
                            failMessages.push(msg);
                            failCount++;
                            return Promise.resolve();
                        }
                        
                        const newCourseData = {
                            student_id: course.student_id,
                            teacher_id: course.teacher_id,
                            course_date: targetDateStr,
                            subject: course.subject,
                            time_slot: course.time_slot || '',
                            classroom: course.classroom || '',
                            course_id: course.course_id || null
                        };
                        
                        return fetch('/api/courses', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newCourseData)
                        })
                        .then(async res => {
                            const result = await res.json();
                            if (!res.ok) {
                                const errorMsg = result.error || result.message || `HTTP ${res.status} 错误`;
                                failMessages.push(`${currentDateStr} -> ${targetDateStr}: ${errorMsg}`);
                                failCount++;
                                return;
                            }
                            
                            if (result.id) {
                                successCount++;
                            } else {
                                failMessages.push(`${currentDateStr} -> ${targetDateStr}: 返回结果异常`);
                                failCount++;
                            }
                        })
                        .catch(err => {
                            failMessages.push(`${currentDateStr} -> ${targetDateStr}: ${err.message}`);
                            failCount++;
                        });
                    });
                    
                    Promise.all(promises).then(() => {
                        let message = `复制完成！成功：${successCount}条，失败：${failCount}条`;
                        if (skippedCount > 0) {
                            message += `，跳过重复：${skippedCount}条`;
                        }
                        if (failMessages.length > 0) {
                            message += '\n\n失败详情：\n' + failMessages.slice(0, 5).join('\n');
                            if (failMessages.length > 5) {
                                message += `\n... 还有 ${failMessages.length - 5} 条错误`;
                            }
                        }
                        alert(message);
                        
                        // 清除选中的复选框
                        checkedBoxes.forEach(cb => cb.checked = false);
                        const selectAllCheckbox = document.getElementById('select-all-checkbox');
                        if (selectAllCheckbox) selectAllCheckbox.checked = false;
                        updateBatchDeleteButton();
                        
                        // 切换到目标周查看结果
                        setTimeout(() => {
                            monthInput.value = targetMonth;
                            updateWeekOptions();
                            weekSelect.value = targetWeek;
                            refreshPageWithCurrentSelection();
                        }, 300);
                    });
                })
                .catch(err => {
                    console.error('获取排课数据失败:', err);
                    alert('获取排课数据失败：' + err.message);
                });
        }
        
        // 复制当前周排课到下一周
        function copyToNextWeek() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                alert('请先选择月份和周');
                return;
            }
            
            // 获取选中的课程复选框
            const checkedBoxes = document.querySelectorAll('.course-checkbox:checked');
            const selectedCourseIds = Array.from(checkedBoxes).map(cb => {
                const value = cb.value;
                // 确保转换为数字类型
                const id = typeof value === 'string' ? parseInt(value, 10) : value;
                if (isNaN(id)) {
                    console.warn('无效的课程ID:', value);
                    return null;
                }
                return id;
            }).filter(id => id !== null);
            
            console.log('选中的课程复选框数量:', checkedBoxes.length);
            console.log('解析后的课程ID:', selectedCourseIds);
            
            // 如果没有选中任何课程，使用当前周的所有课程
            // 注意：这里不提前返回，而是继续执行，在获取数据后再检查
            
            const currentWeek = getCurrentWeekDateRange();
            const nextWeek = getNextWeekDateRange();
            
            if (!currentWeek || !nextWeek) {
                alert('无法计算下一周的日期范围');
                return;
            }
            
            // 注意：确认消息将在获取数据后显示，因为需要知道实际要复制的课程数量
            
            // 获取当前周的排课数据
            const month = monthInput.value;
            const week = weekSelect.value;
            
            // 构建URL，包含筛选参数（与loadCourses函数保持一致）
            const params = [`month=${encodeURIComponent(month)}`, `week=${encodeURIComponent(week)}`];
            
            // 添加筛选参数
            const filterTeacher = document.getElementById('filter-teacher');
            const filterClassroom = document.getElementById('filter-classroom');
            const filterSubject = document.getElementById('filter-subject');
            const filterGrade = document.getElementById('filter-grade');
            
            if (filterTeacher && filterTeacher.value) {
                params.push(`teacher=${encodeURIComponent(filterTeacher.value)}`);
            }
            if (filterClassroom && filterClassroom.value) {
                params.push(`classroom=${encodeURIComponent(filterClassroom.value)}`);
            }
            if (filterSubject && filterSubject.value) {
                params.push(`subject=${encodeURIComponent(filterSubject.value)}`);
            }
            if (filterGrade && filterGrade.value) {
                params.push(`grade=${encodeURIComponent(filterGrade.value)}`);
            }
            
            const url = `/api/courses?${params.join('&')}`;
            
            // 辅助函数：格式化日期为 YYYY-MM-DD
            function formatDate(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            
            // 辅助函数：根据日期获取星期
            function getWeekday(dateStr) {
                const date = new Date(dateStr);
                const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                return weekdays[date.getDay()];
            }
            
            // 同时获取当前周和下一周的排课数据
            Promise.all([
                fetch(url).then(res => res.json()),
                (() => {
                    // 计算下一周的月份和周数
                    const currentMonthNum = parseInt(month.split('-')[1]);
                    const currentYear = parseInt(month.split('-')[0]);
                    let nextMonth, nextWeekNum;
                    
                    if (nextWeek.month !== currentMonthNum) {
                        // 下一周在下一个月
                        nextMonth = `${nextWeek.year}-${String(nextWeek.month).padStart(2, '0')}`;
                        nextWeekNum = 1;
                    } else {
                        // 下一周在当前月内
                        nextMonth = month;
                        nextWeekNum = parseInt(week) + 1;
                    }
                    
                    // 构建下一周的URL，也包含筛选参数
                    const nextParams = [`month=${encodeURIComponent(nextMonth)}`, `week=${encodeURIComponent(nextWeekNum)}`];
                    if (filterTeacher && filterTeacher.value) {
                        nextParams.push(`teacher=${encodeURIComponent(filterTeacher.value)}`);
                    }
                    if (filterClassroom && filterClassroom.value) {
                        nextParams.push(`classroom=${encodeURIComponent(filterClassroom.value)}`);
                    }
                    if (filterSubject && filterSubject.value) {
                        nextParams.push(`subject=${encodeURIComponent(filterSubject.value)}`);
                    }
                    if (filterGrade && filterGrade.value) {
                        nextParams.push(`grade=${encodeURIComponent(filterGrade.value)}`);
                    }
                    
                    return fetch(`/api/courses?${nextParams.join('&')}`).then(res => res.json());
                })()
            ])
                .then(([courses, nextWeekCourses]) => {
                    console.log('API返回的当前周课程数量:', courses.length);
                    console.log('选中的课程ID:', selectedCourseIds);
                    console.log('API返回的所有课程ID:', courses.map(c => ({id: c.id, status: c.status, date: c.course_date})));
                    
                    // 过滤掉已删除的排课
                    let validCourses = courses.filter(c => c.status !== '删除');
                    console.log('过滤已删除后的课程数量:', validCourses.length);
                    console.log('有效课程的ID:', validCourses.map(c => c.id));
                    
                    // 检查是否有有效的排课数据
                    if (validCourses.length === 0) {
                        console.log('当前周没有有效的排课数据');
                        console.log('API返回的所有课程:', courses);
                        alert('当前周没有排课数据。请确认：\n1. 当前周是否有排课\n2. 筛选条件是否正确\n3. 课程是否已被删除');
                        return;
                    }
                    
                    // 如果用户选中了课程，只保留选中的课程；否则使用所有有效课程
                    if (selectedCourseIds.length > 0) {
                        const beforeFilter = validCourses.length;
                        // 确保ID类型匹配：将API返回的ID转换为数字进行比较
                        validCourses = validCourses.filter(c => {
                            const courseId = typeof c.id === 'string' ? parseInt(c.id) : c.id;
                            return selectedCourseIds.includes(courseId);
                        });
                        console.log('过滤选中课程后的数量:', validCourses.length, '(之前:', beforeFilter, ')');
                        
                        if (validCourses.length === 0) {
                            console.log('选中的课程ID:', selectedCourseIds);
                            console.log('有效课程的ID:', validCourses.map(c => c.id));
                            console.log('API返回的所有课程（包括已删除）:', courses.map(c => ({id: c.id, status: c.status, date: c.course_date})));
                            
                            // 检查选中的课程是否在其他周
                            const allCheckedBoxes = document.querySelectorAll('.course-checkbox');
                            const checkedCoursesInfo = Array.from(checkedBoxes).map(cb => {
                                const row = cb.closest('tr');
                                const dateCell = row ? row.querySelector('td:nth-child(8)') : null;
                                const date = dateCell ? dateCell.textContent.trim() : '未知';
                                return {id: parseInt(cb.value), date: date};
                            });
                            console.log('选中的课程详细信息:', checkedCoursesInfo);
                            
                            // 获取当前周的日期范围用于提示
                            const currentWeek = getCurrentWeekDateRange();
                            let dateRangeHint = '';
                            if (currentWeek) {
                                const formatDate = (date) => {
                                    const m = String(date.getMonth() + 1).padStart(2, '0');
                                    const d = String(date.getDate()).padStart(2, '0');
                                    return `${m}-${d}`;
                                };
                                dateRangeHint = `\n当前周日期范围: ${formatDate(currentWeek.startDate)} 至 ${formatDate(currentWeek.endDate)}`;
                            }
                            
                            alert(`选中的课程中没有有效的排课数据。\n\n可能的原因：\n1. 选中的课程不在当前周内${dateRangeHint}\n2. 选中的课程已被删除\n3. 选中的课程已被筛选条件过滤\n\n请检查选中的课程是否在当前周内，或取消选中后使用"复制到下一周"复制当前周所有课程。`);
                            return;
                        }
                    } else {
                        // 如果没有选中任何课程，使用所有有效课程
                        console.log('未选中任何课程，使用当前周所有有效课程');
                    }
                    
                    // 过滤掉下一周已删除的排课，只保留有效的排课用于重复检查
                    const validNextWeekCourses = nextWeekCourses.filter(c => c.status !== '删除');
                    
                    // 创建日期映射：当前周的日期 -> 下一周的对应日期（按星期匹配）
                    const dateMap = new Map();
                    
                    // 为当前周的每一天创建映射（按星期匹配）
                    // 使用本地日期，避免时区问题
                    const currentStart = new Date(currentWeek.startDate.getFullYear(), currentWeek.startDate.getMonth(), currentWeek.startDate.getDate());
                    const currentEnd = new Date(currentWeek.endDate.getFullYear(), currentWeek.endDate.getMonth(), currentWeek.endDate.getDate());
                    const nextStart = new Date(nextWeek.startDate.getFullYear(), nextWeek.startDate.getMonth(), nextWeek.startDate.getDate());
                    const nextEnd = new Date(nextWeek.endDate.getFullYear(), nextWeek.endDate.getMonth(), nextWeek.endDate.getDate());
                    
                    console.log('当前周日期范围:', formatDate(currentStart), '至', formatDate(currentEnd));
                    console.log('下一周日期范围:', formatDate(nextStart), '至', formatDate(nextEnd));
                    
                    // 检查是否跨月复制
                    const isCrossMonth = currentWeek.month !== nextWeek.month || currentWeek.year !== nextWeek.year;
                    
                    // 计算下下周的日期范围（用于fallback）
                    const nextNextWeek = getNextNextWeekDateRange(nextWeek);
                    let nextNextStart = null;
                    let nextNextEnd = null;
                    if (nextNextWeek) {
                        nextNextStart = new Date(nextNextWeek.startDate.getFullYear(), nextNextWeek.startDate.getMonth(), nextNextWeek.startDate.getDate());
                        nextNextEnd = new Date(nextNextWeek.endDate.getFullYear(), nextNextWeek.endDate.getMonth(), nextNextWeek.endDate.getDate());
                        console.log('下下周日期范围:', formatDate(nextNextStart), '至', formatDate(nextNextEnd));
                    }
                    
                    // 按星期匹配：周一的课复制到下一周的周一，周二的课复制到下一周的周二，以此类推
                    // 遍历当前周的每一天
                    let currentDate = new Date(currentStart);
                    const currentEndTime = currentEnd.getTime();
                    const nextStartTime = nextStart.getTime();
                    const nextEndTime = nextEnd.getTime();
                    const nextNextStartTime = nextNextStart ? nextNextStart.getTime() : null;
                    const nextNextEndTime = nextNextEnd ? nextNextEnd.getTime() : null;
                    
                    // 如果跨月复制，记录下一周和下下周已使用的日期，避免重复映射
                    const usedNextDates = new Set();
                    const usedNextNextDates = new Set();
                    
                    while (currentDate.getTime() <= currentEndTime) {
                        const currentWeekday = currentDate.getDay(); // 0=周日, 1=周一, ..., 6=周六
                        const currentDateStr = formatDate(currentDate);
                        
                        // 计算下一周相同星期的日期
                        // 方法：找到下一周范围内相同星期的日期
                        let nextDate = null;
                        let mappedToNextNextWeek = false;
                        
                        // 首先尝试在下一周找到相同星期的日期
                        let checkDate = new Date(nextStart);
                        const checkEndTime = nextEnd.getTime();
                        
                        while (checkDate.getTime() <= checkEndTime) {
                            if (checkDate.getDay() === currentWeekday) {
                                const checkDateStr = formatDate(checkDate);
                                // 如果跨月复制，检查该日期是否已被使用
                                if (!isCrossMonth || !usedNextDates.has(checkDateStr)) {
                                    nextDate = new Date(checkDate);
                                    usedNextDates.add(formatDate(nextDate));
                                    break;
                                }
                            }
                            checkDate.setDate(checkDate.getDate() + 1);
                        }
                        
                        // 如果下一周没有找到匹配的日期，尝试在下下周查找
                        if (!nextDate && nextNextStart && nextNextEnd) {
                            let checkNextNextDate = new Date(nextNextStart);
                            const checkNextNextEndTime = nextNextEnd.getTime();
                            
                            while (checkNextNextDate.getTime() <= checkNextNextEndTime) {
                                if (checkNextNextDate.getDay() === currentWeekday) {
                                    const checkNextNextDateStr = formatDate(checkNextNextDate);
                                    if (!usedNextNextDates.has(checkNextNextDateStr)) {
                                        nextDate = new Date(checkNextNextDate);
                                        usedNextNextDates.add(formatDate(nextDate));
                                        mappedToNextNextWeek = true;
                                        console.log(`跨周映射（下一周无匹配）: ${currentDateStr} (星期${currentWeekday}) -> ${formatDate(nextDate)} (下下周相同星期)`);
                                        break;
                                    }
                                }
                                checkNextNextDate.setDate(checkNextNextDate.getDate() + 1);
                            }
                        }
                        
                        // 如果跨月复制且仍然没有找到对应日期，使用fallback机制
                        if (!nextDate && isCrossMonth) {
                            // 优先尝试下一周的第一个可用日期
                            let fallbackDate = new Date(nextStart);
                            while (fallbackDate.getTime() <= nextEndTime) {
                                const fallbackDateStr = formatDate(fallbackDate);
                                if (!usedNextDates.has(fallbackDateStr)) {
                                    nextDate = new Date(fallbackDate);
                                    usedNextDates.add(fallbackDateStr);
                                    console.log(`跨月映射（无对应星期，使用下一周fallback）: ${currentDateStr} (星期${currentWeekday}) -> ${fallbackDateStr}`);
                                    break;
                                }
                                fallbackDate.setDate(fallbackDate.getDate() + 1);
                            }
                            
                            // 如果下一周也没有可用日期，尝试下下周
                            if (!nextDate && nextNextStart && nextNextEnd) {
                                fallbackDate = new Date(nextNextStart);
                                while (fallbackDate.getTime() <= nextNextEndTime) {
                                    const fallbackDateStr = formatDate(fallbackDate);
                                    if (!usedNextNextDates.has(fallbackDateStr)) {
                                        nextDate = new Date(fallbackDate);
                                        usedNextNextDates.add(fallbackDateStr);
                                        mappedToNextNextWeek = true;
                                        console.log(`跨月映射（无对应星期，使用下下周fallback）: ${currentDateStr} (星期${currentWeekday}) -> ${fallbackDateStr}`);
                                        break;
                                    }
                                    fallbackDate.setDate(fallbackDate.getDate() + 1);
                                }
                            }
                        }
                        
                        if (nextDate) {
                            const nextDateStr = formatDate(nextDate);
                            dateMap.set(currentDateStr, nextDateStr);
                            if (mappedToNextNextWeek) {
                                console.log(`日期映射（下下周）: ${currentDateStr} (星期${currentWeekday}) -> ${nextDateStr} (下下周)`);
                            } else if (isCrossMonth && nextDate.getDay() !== currentWeekday) {
                                console.log(`跨月映射（星期不匹配）: ${currentDateStr} (星期${currentWeekday}) -> ${nextDateStr} (星期${nextDate.getDay()})`);
                            } else {
                                console.log(`日期映射: ${currentDateStr} (星期${currentWeekday}) -> ${nextDateStr} (下一周相同星期)`);
                            }
                        } else {
                            // 如果仍然没有找到日期（这种情况不应该发生），使用下一周的第一天
                            const fallbackDateStr = formatDate(nextStart);
                            dateMap.set(currentDateStr, fallbackDateStr);
                            console.warn(`警告: 当前周 ${currentDateStr} (星期${currentWeekday}) 无法找到对应日期，使用下一周第一天: ${fallbackDateStr}`);
                        }
                        
                        // 移动到下一天
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                    
                    console.log('日期映射表:', Array.from(dateMap.entries()));
                    
                    // 检查日期映射是否有效
                    if (dateMap.size === 0) {
                        alert('无法创建日期映射。当前周和下一周没有重叠的星期。\n\n这可能是因为跨月时，当前周的最后几天在下一周没有对应的日期。\n\n建议：\n1. 检查当前周和下一周的日期范围\n2. 确保下一周包含当前周的所有星期');
                        return;
                    }
                    
                    // 统计有多少课程因为没有对应日期而被跳过（跨月复制时应该为0，因为我们已经做了fallback映射）
                    const coursesWithoutMapping = validCourses.filter(course => {
                        const currentDateStr = course.course_date;
                        return !dateMap.has(currentDateStr);
                    });
                    
                    if (coursesWithoutMapping.length > 0) {
                        const skippedDates = [...new Set(coursesWithoutMapping.map(c => c.course_date))];
                        console.warn(`警告: 有 ${coursesWithoutMapping.length} 条课程因为没有对应日期将被跳过`);
                        console.warn(`跳过的日期:`, skippedDates);
                    } else if (isCrossMonth) {
                        // 统计有多少课程被映射到下下周
                        let mappedToNextNextCount = 0;
                        if (nextNextStart && nextNextEnd) {
                            validCourses.forEach(course => {
                                const currentDateStr = course.course_date;
                                const mappedDateStr = dateMap.get(currentDateStr);
                                if (mappedDateStr) {
                                    const mappedDate = new Date(mappedDateStr);
                                    if (mappedDate.getTime() >= nextNextStart.getTime() && mappedDate.getTime() <= nextNextEnd.getTime()) {
                                        mappedToNextNextCount++;
                                    }
                                }
                            });
                        }
                        if (mappedToNextNextCount > 0) {
                            console.log(`跨月复制：${mappedToNextNextCount} 条课程被映射到下下周，其余课程映射到下一周`);
                        } else {
                            console.log('跨月复制：所有课程都已成功映射到下一周（包括fallback映射）');
                        }
                    }
                    
                    // 创建下一周排课的唯一标识集合，用于快速检查重复
                    // 检查条件：日期、学生姓名、科目、时段相同（因为日期已经确定了星期）
                    const nextWeekCourseKeys = new Set();
                    console.log('下一周已存在的排课记录:');
                    validNextWeekCourses.forEach(course => {
                        // 确保日期格式一致（YYYY-MM-DD）
                        const dateStr = course.course_date;
                        // 使用日期+学生姓名+科目+时段作为唯一标识
                        const key = `${dateStr}|${course.student_name}|${course.subject}|${course.time_slot || ''}`;
                        nextWeekCourseKeys.add(key);
                        console.log(`  - ${key}`);
                    });
                    console.log(`下一周共有 ${nextWeekCourseKeys.size} 条唯一记录`);
                    
                    // 过滤掉重复的课程
                    // 同时记录已经处理过的记录，避免当前周内重复记录被重复复制
                    const processedKeys = new Set();
                    const coursesToCopy = validCourses.filter(course => {
                        const currentDateStr = course.course_date;
                        const nextDateStr = dateMap.get(currentDateStr);
                        
                        if (!nextDateStr) {
                            console.log(`跳过（无对应日期）: ${currentDateStr} - ${course.student_name}`);
                            return false; // 没有对应的下一周日期，跳过
                        }
                        
                        // 确保日期格式一致（YYYY-MM-DD）
                        // 构建唯一标识：日期、学生姓名、科目、时段
                        // 使用日期而不是星期，因为日期是唯一的，且已经确定了星期
                        const key = `${nextDateStr}|${course.student_name}|${course.subject}|${course.time_slot || ''}`;
                        
                        // 如果下一周已存在相同的记录，则跳过
                        if (nextWeekCourseKeys.has(key)) {
                            console.log(`跳过重复记录（下一周已存在）: ${currentDateStr} -> ${nextDateStr} | ${course.student_name} | ${course.subject} | ${course.time_slot || ''}`);
                            return false;
                        }
                        
                        // 如果当前周内已经有相同的记录要复制，也跳过（避免当前周内重复记录被重复复制）
                        if (processedKeys.has(key)) {
                            console.log(`跳过重复记录（当前周内重复）: ${currentDateStr} -> ${nextDateStr} | ${course.student_name} | ${course.subject} | ${course.time_slot || ''}`);
                            return false;
                        }
                        
                        // 标记这条记录已经被处理
                        processedKeys.add(key);
                        console.log(`将复制: ${currentDateStr} -> ${nextDateStr} | ${course.student_name} | ${course.subject} | ${course.time_slot || ''}`);
                        return true;
                    });
                    
                    const skippedCount = validCourses.length - coursesToCopy.length;
                    const skippedWithoutMapping = coursesWithoutMapping.length;
                    const skippedDuplicates = skippedCount - skippedWithoutMapping;
                    
                    if (skippedCount > 0) {
                        console.log(`已跳过 ${skippedCount} 条记录（其中 ${skippedWithoutMapping} 条因为没有对应日期，${skippedDuplicates} 条因为重复）`);
                    }
                    
                    if (coursesToCopy.length === 0) {
                        let alertMessage = '没有可复制的排课记录。\n\n';
                        if (skippedWithoutMapping > 0) {
                            alertMessage += `原因：\n1. 有 ${skippedWithoutMapping} 条课程因为没有对应日期被跳过\n`;
                        }
                        if (skippedDuplicates > 0) {
                            alertMessage += `${skippedWithoutMapping > 0 ? '2. ' : ''}有 ${skippedDuplicates} 条课程因为下一周已存在相同记录被跳过\n`;
                        }
                        if (skippedWithoutMapping === 0 && skippedDuplicates === 0) {
                            alertMessage += '所有排课记录都已存在于下一周，无需复制。';
                        }
                        alert(alertMessage);
                        return;
                    }
                    
                    // 构建确认消息（在coursesToCopy定义之后）
                    const currentMonthNum = parseInt(monthInput.value.split('-')[1]);
                    let confirmMessage;
                    if (nextWeek.month !== currentMonthNum) {
                        // 下一周在下一个月
                        const nextMonth = nextWeek.month;
                        const nextYear = nextWeek.year;
                        confirmMessage = `确定要将 ${coursesToCopy.length} 条排课复制到${nextYear}年${nextMonth}月第1周吗？`;
                    } else {
                        // 下一周在当前月内
                        const nextWeekNum = parseInt(weekSelect.value) + 1;
                        confirmMessage = `确定要将 ${coursesToCopy.length} 条排课复制到第${nextWeekNum}周吗？`;
                    }
                    
                    // 添加额外提示信息
                    if (skippedWithoutMapping > 0) {
                        confirmMessage += `\n\n注意：有 ${skippedWithoutMapping} 条课程因为没有对应日期将被跳过。`;
                    }
                    if (skippedDuplicates > 0) {
                        confirmMessage += `\n\n注意：有 ${skippedDuplicates} 条课程因为下一周已存在相同记录将被跳过。`;
                    }
                    
                    // 跨月复制时的特殊提示
                    let confirmMessageExtra = '';
                    if (skippedWithoutMapping === 0 && isCrossMonth && nextNextStart && nextNextEnd) {
                        // 统计有多少课程被映射到下下周
                        let mappedToNextNextCount = 0;
                        validCourses.forEach(course => {
                            const currentDateStr = course.course_date;
                            const mappedDateStr = dateMap.get(currentDateStr);
                            if (mappedDateStr) {
                                const mappedDate = new Date(mappedDateStr);
                                if (mappedDate.getTime() >= nextNextStart.getTime() && mappedDate.getTime() <= nextNextEnd.getTime()) {
                                    mappedToNextNextCount++;
                                }
                            }
                        });
                        
                        if (mappedToNextNextCount > 0) {
                            confirmMessageExtra = `\n\n注意：跨月复制时，有 ${mappedToNextNextCount} 条课程因为在下一周没有匹配的日期，将被复制到下下周（${formatDate(nextNextStart)} 至 ${formatDate(nextNextEnd)}）。`;
                        } else {
                            confirmMessageExtra = `\n\n注意：跨月复制时，如果当前周的某些日期在下一周没有对应星期，这些课程将被映射到下一周的第一个可用日期。`;
                        }
                    }
                    if (confirmMessageExtra) {
                        confirmMessage += confirmMessageExtra;
                    }
                    
                    if (!confirm(confirmMessage)) {
                        return;
                    }
                    
                    // 批量创建排课
                    let successCount = 0;
                    let failCount = 0;
                    const failMessages = [];
                    
                    const promises = coursesToCopy.map(course => {
                        const currentDateStr = course.course_date;
                        const nextDateStr = dateMap.get(currentDateStr);
                        
                        if (!nextDateStr) {
                            const msg = `课程日期 ${currentDateStr} 没有找到对应的下一周日期`;
                            console.warn(msg);
                            failMessages.push(msg);
                            failCount++;
                            return Promise.resolve();
                        }
                        
                        // 创建新的排课数据
                        const newCourseData = {
                            student_id: course.student_id,
                            teacher_id: course.teacher_id,
                            course_date: nextDateStr,
                            subject: course.subject,
                            time_slot: course.time_slot || '',
                            classroom: course.classroom || '',
                            course_id: course.course_id || null
                        };
                        
                        console.log(`复制课程: ${currentDateStr} -> ${nextDateStr}`, newCourseData);
                        
                        return fetch('/api/courses', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newCourseData)
                        })
                        .then(async res => {
                            const result = await res.json();
                            if (!res.ok) {
                                // API返回错误
                                const errorMsg = result.error || result.message || `HTTP ${res.status} 错误`;
                                console.error('复制排课失败:', errorMsg, result);
                                failMessages.push(`${currentDateStr} -> ${nextDateStr}: ${errorMsg}`);
                                failCount++;
                                return;
                            }
                            
                            if (result.id) {
                                console.log('复制成功:', result.id);
                                successCount++;
                            } else {
                                console.warn('复制返回结果异常:', result);
                                failMessages.push(`${currentDateStr} -> ${nextDateStr}: 返回结果异常`);
                                failCount++;
                            }
                        })
                        .catch(err => {
                            console.error('复制排课异常:', err);
                            failMessages.push(`${currentDateStr} -> ${nextDateStr}: ${err.message}`);
                            failCount++;
                        });
                    });
                    
                    Promise.all(promises).then(() => {
                        let message = `复制完成！成功：${successCount}条，失败：${failCount}条`;
                        if (skippedCount > 0) {
                            if (skippedWithoutMapping > 0 && skippedDuplicates > 0) {
                                message += `，跳过：${skippedWithoutMapping}条（无对应日期）+ ${skippedDuplicates}条（重复）`;
                            } else if (skippedWithoutMapping > 0) {
                                message += `，跳过：${skippedWithoutMapping}条（无对应日期）`;
                            } else {
                                message += `，跳过重复：${skippedDuplicates}条`;
                            }
                        }
                        if (failMessages.length > 0) {
                            message += '\n\n失败详情：\n' + failMessages.slice(0, 5).join('\n');
                            if (failMessages.length > 5) {
                                message += `\n... 还有 ${failMessages.length - 5} 条错误`;
                            }
                            console.error('复制失败详情:', failMessages);
                        }
                        alert(message);
                        
                        // 清除选中的复选框
                        checkedBoxes.forEach(cb => cb.checked = false);
                        const selectAllCheckbox = document.getElementById('select-all-checkbox');
                        if (selectAllCheckbox) selectAllCheckbox.checked = false;
                        updateBatchDeleteButton();
                        
                        // 切换到下一周查看结果
                        // 等待一小段时间确保数据已保存到数据库
                        setTimeout(() => {
                            // 根据nextWeek的结果判断是否需要切换月份
                            const currentMonthNum = parseInt(month.split('-')[1]);
                            if (nextWeek.month !== currentMonthNum) {
                                // 下一周在下一个月，切换到下一月第1周
                                const nextMonth = nextWeek.month;
                                const nextYear = nextWeek.year;
                                monthInput.value = `${nextYear}-${String(nextMonth).padStart(2, '0')}`;
                                weekSelect.value = 1;
                            } else {
                                // 下一周在当前月内
                                const nextWeekNum = parseInt(week) + 1;
                                if (nextWeekNum <= 5) {
                                    weekSelect.value = nextWeekNum;
                                } else {
                                    // 如果周数超出范围，说明已经是最后一周，切换到下一月第1周
                                    const [year, monthNum] = month.split('-').map(Number);
                                    const nextMonth = monthNum === 12 ? 1 : monthNum + 1;
                                    const nextYear = monthNum === 12 ? year + 1 : year;
                                    monthInput.value = `${nextYear}-${String(nextMonth).padStart(2, '0')}`;
                                    weekSelect.value = 1;
                                }
                            }
                            // 刷新页面并保持当前选择（已切换到下一周）
                            refreshPageWithCurrentSelection();
                        }, 300); // 等待300ms确保数据已保存
                    });
                })
                .catch(err => {
                    console.error('获取排课数据失败:', err);
                    alert('获取排课数据失败：' + err.message);
                });
        }
        
        // 计算日期在该月是第几周（每月从第1周开始）
        // 第1周：从1号开始，到第一个周日结束
        // 第2周及以后：从第一个周一开始，每7天一周
        function getWeekInMonth(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            const dayOfMonth = date.getDate();
            
            // 获取该月1号
            const firstDay = new Date(year, month, 1);
            const firstDayWeekday = firstDay.getDay(); // 0=Sunday, 1=Monday, ..., 6=Saturday
            
            if (firstDayWeekday === 0) {
                // 1号是周日，第1周只有1号
                if (dayOfMonth === 1) {
                    return 1;
                } else {
                    // 从第2周开始
                    const firstMonday = new Date(year, month, 2);
                    const daysFromFirstMonday = dayOfMonth - firstMonday.getDate();
                    const weekNum = Math.floor(daysFromFirstMonday / 7) + 2;
                    return Math.min(weekNum, 5);
                }
            } else {
                // 找到第一个周日
                // 计算到周日需要多少天：7 - firstDayWeekday
                // 例如：周一(1)->6天到周日, 周二(2)->5天, ..., 周六(6)->1天
                const daysToSunday = 7 - firstDayWeekday;
                const firstSunday = new Date(year, month, 1 + daysToSunday);
                
                if (dayOfMonth <= firstSunday.getDate()) {
                    // 在第1周内（1号到第一个周日）
                    return 1;
                } else {
                    // 在第2周及以后
                    // 找到第一个周一
                    const daysToMonday = 7 - firstDayWeekday; // 1=周二->6天, 2=周三->5天, ..., 6=周日->1天
                    const firstMonday = new Date(year, month, 1 + daysToMonday);
                    const daysFromFirstMonday = dayOfMonth - firstMonday.getDate();
                    const weekNum = Math.floor(daysFromFirstMonday / 7) + 2;
                    return Math.min(weekNum, 5);
                }
            }
        }
        
        // 更新周选择器选项（根据月份计算该月有几周）
        function updateWeekOptions() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (!monthInput || !weekSelect) return;
            
            const monthValue = monthInput.value;
            if (!monthValue) return;
            
            // 计算该月有多少周
            // 第1周：从1号开始，到第一个周日结束
            // 第2周及以后：从第一个周一开始，每7天一周
            const [year, month] = monthValue.split('-').map(Number);
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const firstDayWeekday = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            let maxWeeks = 1;
            
            if (firstDayWeekday === 0) {
                // 1号是周日，第1周只有1号
                // 从第2周开始计算
                const firstMonday = new Date(year, month - 1, 2);
                let currentMonday = new Date(firstMonday);
                let weekNum = 2;
                
                while (currentMonday.getDate() <= daysInMonth && weekNum <= 5) {
                    maxWeeks = weekNum;
                    currentMonday = new Date(currentMonday);
                    currentMonday.setDate(currentMonday.getDate() + 7);
                    weekNum++;
                }
            } else {
                // 第1周：1号到第一个周日
                maxWeeks = 1;
                
                // 从第2周开始计算
                const daysToMonday = 7 - firstDayWeekday;
                const firstMonday = new Date(year, month - 1, 1 + daysToMonday);
                let currentMonday = new Date(firstMonday);
                let weekNum = 2;
                
                while (currentMonday.getDate() <= daysInMonth && weekNum <= 5) {
                    maxWeeks = weekNum;
                    currentMonday = new Date(currentMonday);
                    currentMonday.setDate(currentMonday.getDate() + 7);
                    weekNum++;
                }
            }
            
            // 更新周选择器选项
            const currentValue = weekSelect.value;
            const newValue = (!currentValue || parseInt(currentValue) > maxWeeks || parseInt(currentValue) < 1) ? '1' : currentValue;
            
            // 临时移除onchange属性，避免触发handleWeekChange
            const originalOnchange = weekSelect.getAttribute('onchange');
            weekSelect.removeAttribute('onchange');
            
            weekSelect.innerHTML = '';
            for (let i = 1; i <= maxWeeks; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `第${i}周`;
                weekSelect.appendChild(option);
            }
            
            // 设置周数选择器的值
            weekSelect.value = newValue;
            
            // 恢复onchange属性
            if (originalOnchange) {
                weekSelect.setAttribute('onchange', originalOnchange);
            } else {
                weekSelect.setAttribute('onchange', 'handleWeekChange();');
            }
            
            console.log('updateWeekOptions 完成，当前周数:', weekSelect.value, '月份:', monthValue);
            updateWeekInfo();
            // 确保数据加载 - 直接调用loadCourses，因为此时周数选择器已经更新完成
            console.log('updateWeekOptions 调用 loadCourses，月份:', monthValue, '周数:', weekSelect.value);
            loadCourses();
            // 数据加载完成后再更新筛选选项（异步）
            setTimeout(() => {
                initFilters();
            }, 200);
        }
        
        // 全选/取消全选函数在app.js中定义，这里不需要重复定义
        
        // updateBatchDeleteButton函数在app.js中定义，这里不需要重复定义
        
        // 批量删除排课
        function batchDeleteCourses() {
            const checkboxes = document.querySelectorAll('.course-checkbox:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            
            if (selectedIds.length === 0) {
                alert('请先选择要删除的排课');
                return;
            }
            
            if (!confirm(`确定要删除选中的 ${selectedIds.length} 条排课吗？`)) {
                return;
            }
            
            // 批量删除
            let successCount = 0;
            let failCount = 0;
            const promises = selectedIds.map(id => {
                return fetch(`/api/courses/${id}`, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    })
                    .catch(err => {
                        console.error('删除排课失败:', err);
                        failCount++;
                    });
            });
            
            Promise.all(promises).then(() => {
                alert(`批量删除完成！成功：${successCount}条，失败：${failCount}条`);
                // 刷新页面并保持当前选择
                refreshPageWithCurrentSelection();
            });
        }
    </script>
