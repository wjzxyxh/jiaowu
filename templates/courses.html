<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排课管理 - 教务管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>排课管理</h1>
        </header>

        <main>
            <div class="page-header">
                <button class="btn-back" onclick="window.close()">← 关闭窗口</button>
            </div>
            <div class="toolbar" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-start;">
                <button class="btn btn-primary" onclick="showAddCourseModal()">新增排课</button>
                <button class="btn btn-secondary" onclick="goToPreviousWeek()" title="上一周">← 上一周</button>
                <input type="month" id="course-month" value="" onchange="updateWeekOptions()">
                <select id="course-week-select" onchange="handleWeekChange();">
                    <option value="1">第1周</option>
                    <option value="2">第2周</option>
                    <option value="3">第3周</option>
                    <option value="4">第4周</option>
                    <option value="5">第5周</option>
                </select>
                <button class="btn btn-secondary" onclick="goToNextWeek()" title="下一周">下一周 →</button>
                <button class="btn btn-secondary" id="view-mode-btn" onclick="toggleViewMode()">切换到星期模式</button>
                <span id="week-info-label" class="week-info-label"></span>
                <button class="btn btn-secondary" id="copy-to-specified-week-btn" onclick="showCopyToSpecifiedWeekModal()">复制到指定周</button>
                <button class="btn btn-secondary" id="copy-to-next-week-btn" onclick="copyToNextWeek()" style="margin-left: 0; margin-right: 0;">复制到下一周</button>
            </div>
            <div class="filter-bar" style="margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <label style="font-weight: bold;">筛选：</label>
                <select id="filter-teacher" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="">全部老师</option>
                </select>
                <select id="filter-classroom" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="">全部教室</option>
                </select>
                <select id="filter-subject" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="">全部科目</option>
                </select>
                <select id="filter-grade" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="">全部年级</option>
                </select>
                <button class="btn btn-secondary" onclick="clearFilters()" style="padding: 6px 12px;">清除筛选</button>
                <button class="btn btn-success" id="batch-confirm-btn" onclick="batchConfirmCourses()" style="background: #28a745; color: white; padding: 6px 12px;">批量确认</button>
                <button class="btn btn-secondary" id="batch-cancel-btn" onclick="batchCancelConfirmCourses()" style="background: #6c757d; color: white; padding: 6px 12px;">批量取消</button>
                <button class="btn btn-danger" id="batch-delete-btn" onclick="batchDeleteCourses()" style="padding: 6px 12px;">批量删除</button>
            </div>
            <div id="courses-list-view">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll()"></th>
                            <th>序号</th>
                            <th>学生姓名</th>
                            <th>年级</th>
                            <th>科目</th>
                            <th>课程名称</th>
                            <th>老师</th>
                            <th>日期</th>
                            <th>星期</th>
                            <th>时段</th>
                            <th>教室</th>
                            <th>状态</th>
                            <th>确认</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="courses-table-body"></tbody>
                </table>
                <!-- 分页控件 -->
                <div id="courses-pagination" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <button class="btn btn-secondary" id="courses-prev-btn" onclick="coursesPreviousPage()" disabled>上一页</button>
                    <span id="courses-page-info" style="padding: 0 15px;">第 1 页，共 1 页</span>
                    <button class="btn btn-secondary" id="courses-next-btn" onclick="coursesNextPage()" disabled>下一页</button>
                </div>
            </div>
            <div id="courses-week-view" style="display: none;">
                <table class="data-table" id="week-view-table">
                    <thead id="week-view-thead"></thead>
                    <tbody id="week-view-tbody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        // 视图模式：'list' 或 'week'
        let currentViewMode = 'list';
        
        // 切换视图模式
        function toggleViewMode() {
            const listView = document.getElementById('courses-list-view');
            const weekView = document.getElementById('courses-week-view');
            const modeBtn = document.getElementById('view-mode-btn');
            
            if (currentViewMode === 'list') {
                // 切换到星期模式
                currentViewMode = 'week';
                window.currentViewMode = 'week'; // 设置为全局变量
                listView.style.display = 'none';
                weekView.style.display = 'block';
                modeBtn.textContent = '切换到列表模式';
                loadCourses();
            } else {
                // 切换到列表模式
                currentViewMode = 'list';
                window.currentViewMode = 'list'; // 设置为全局变量
                listView.style.display = 'block';
                weekView.style.display = 'none';
                modeBtn.textContent = '切换到星期模式';
                loadCourses();
            }
        }
        
        // 初始化视图模式
        window.currentViewMode = 'list';
        
        // 更新周信息显示
        function updateWeekInfo() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            const weekInfoLabel = document.getElementById('week-info-label');
            
            if (!monthInput || !weekSelect || !weekInfoLabel) return;
            
            const monthValue = monthInput.value;
            const weekValue = weekSelect.value;
            
            if (!monthValue || !weekValue) {
                weekInfoLabel.textContent = '';
                return;
            }
            
            const [year, month] = monthValue.split('-').map(Number);
            const weekNum = parseInt(weekValue);
            const firstDay = new Date(year, month - 1, 1);
            const firstDayWeekday = firstDay.getDay();
            const lastDay = new Date(year, month, 0);
            const monthEnd = lastDay.getDate();
            
            let startDate, endDate;
            
            if (weekNum === 1) {
                // 第1周：从1号开始，到第一个周日结束
                if (firstDayWeekday === 0) {
                    // 1号是周日，第1周只有1号
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month - 1, 1);
                } else {
                    // 找到第一个周日
                    // JavaScript getDay(): 0=周日, 1=周一, 2=周二, 3=周三, 4=周四, 5=周五, 6=周六
                    // 计算到周日(0)需要多少天：如果firstDayWeekday是n，需要(7-n)天到达下一个周日
                    // 但需要处理firstDayWeekday=0的情况，所以用(7 - firstDayWeekday) % 7
                    // 当firstDayWeekday=0时，(7-0)%7=0，但实际应该是7（下一周），所以需要特殊处理
                    // 当firstDayWeekday>0时，直接计算(7 - firstDayWeekday)
                    const daysToSunday = firstDayWeekday === 0 ? 0 : (7 - firstDayWeekday);
                    const firstSundayDate = Math.min(1 + daysToSunday, monthEnd);
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month - 1, firstSundayDate);
                }
            } else {
                // 第2周及以后：从第一个周一开始
                let daysToMonday;
                if (firstDayWeekday === 0) {
                    daysToMonday = 1; // 1号是周日，第一个周一是2号
                } else {
                    daysToMonday = 7 - firstDayWeekday;
                }
                
                const firstMondayDate = 1 + daysToMonday;
                const startDateNum = firstMondayDate + (weekNum - 2) * 7;
                
                // 如果开始日期超出月份，说明该周不存在，清空显示
                if (startDateNum > monthEnd) {
                    weekInfoLabel.textContent = '';
                    return;
                }
                
                startDate = new Date(year, month - 1, startDateNum);
                // 一周的结束是周日，所以结束日期是开始日期（周一）+6天
                const endDateNum = Math.min(startDateNum + 6, monthEnd);
                endDate = new Date(year, month - 1, endDateNum);
            }
            
            // 格式化日期为 MM-DD
            const formatDate = (date) => {
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${m}-${d}`;
            };
            
            const startStr = formatDate(startDate);
            const endStr = formatDate(endDate);
            weekInfoLabel.textContent = `${year}年${String(month).padStart(2, '0')}月 第${weekNum}周 ${startStr} 至 ${endStr}`;
        }
        
        // 处理周数改变事件
        function handleWeekChange() {
            const weekSelect = document.getElementById('course-week-select');
            const monthInput = document.getElementById('course-month');
            
            console.log('handleWeekChange 被调用');
            console.log('月份:', monthInput ? monthInput.value : 'null');
            console.log('周数:', weekSelect ? weekSelect.value : 'null');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                console.log('月份或周数未选择，退出');
                return;
            }
            
            console.log('更新周信息并加载数据，月份:', monthInput.value, '周数:', weekSelect.value);
            updateWeekInfo();
            // 直接调用loadCourses，确保数据加载
            loadCourses();
        }
        
        // 保存当前选择状态到URL参数
        function saveCurrentSelection() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (monthInput && weekSelect && monthInput.value && weekSelect.value) {
                const params = new URLSearchParams();
                params.set('month', monthInput.value);
                params.set('week', weekSelect.value);
                
                // 更新URL但不刷新页面
                const newUrl = window.location.pathname + '?' + params.toString();
                window.history.replaceState({}, '', newUrl);
            }
        }
        
        // 从URL参数恢复选择状态
        function restoreSelectionFromURL() {
            const params = new URLSearchParams(window.location.search);
            const month = params.get('month');
            const week = params.get('week');
            
            if (month && week) {
                const monthInput = document.getElementById('course-month');
                const weekSelect = document.getElementById('course-week-select');
                
                if (monthInput && weekSelect) {
                    monthInput.value = month;
                    updateWeekOptions();
                    weekSelect.value = week;
                    console.log('从URL恢复选择状态:', month, week);
                    return true;
                }
            }
            return false;
        }
        
        // 刷新页面并保持当前选择
        function refreshPageWithCurrentSelection() {
            saveCurrentSelection();
            window.location.reload();
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面初始化开始');
            
            // 检查URL参数中是否有student_id（用于从学生删除页面跳转过来）
            const urlParams = new URLSearchParams(window.location.search);
            const studentIdFromURL = urlParams.get('student_id');
            let studentNoticeElement = null;
            if (studentIdFromURL) {
                // 创建提示信息元素（先不显示，等数据加载完成后再决定显示内容）
                const toolbar = document.querySelector('.toolbar');
                if (toolbar) {
                    studentNoticeElement = document.createElement('div');
                    studentNoticeElement.id = 'student-filter-notice';
                    studentNoticeElement.style.cssText = 'background: #fff3cd; border: 1px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 4px; color: #856404;';
                    studentNoticeElement.textContent = `正在筛选学生ID为 ${studentIdFromURL} 的排课记录...`;
                    toolbar.insertAdjacentElement('afterend', studentNoticeElement);
                }
            }
            
            // 尝试从URL参数恢复选择状态
            const restored = restoreSelectionFromURL();
            
            if (!restored) {
                // 如果没有URL参数，设置当前年月
                const today = new Date();
                const currentMonth = today.toISOString().slice(0, 7);
                const monthInput = document.getElementById('course-month');
                monthInput.value = currentMonth;
                console.log('设置月份:', currentMonth);
                
                // 先更新周选择器选项（这会计算该月有多少周）
                updateWeekOptions();
                
                // 计算当前日期在该月是第几周
                const weekNum = getWeekInMonth(today);
                const weekSelect = document.getElementById('course-week-select');
                weekSelect.value = weekNum;
                console.log('设置周数:', weekNum);
            }
            
            updateWeekInfo();
            initFilters();
            loadCourses();
            
            // 保存当前选择状态到URL（在loadCourses之后，确保数据已加载）
            setTimeout(() => {
                saveCurrentSelection();
            }, 100);
            
            console.log('页面初始化完成');
            
            // 监听月份和周数的变化，自动保存到URL
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (monthInput) {
                monthInput.addEventListener('change', function() {
                    setTimeout(() => saveCurrentSelection(), 100);
                });
            }
            
            if (weekSelect) {
                weekSelect.addEventListener('change', function() {
                    setTimeout(() => saveCurrentSelection(), 100);
                });
            }
        });
        
        // 初始化筛选选项
        function initFilters() {
            // 获取所有课程数据来提取筛选选项
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            let url = '/api/courses';
            if (monthInput && monthInput.value && weekSelect && weekSelect.value) {
                const month = monthInput.value;
                const week = weekSelect.value;
                url += `?month=${month}&week=${week}`;
            }
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    // 提取唯一的选项
                    const teachers = new Set();
                    const classrooms = new Set();
                    const subjects = new Set();
                    const grades = new Set();
                    
                    data.forEach(c => {
                        if (c.teacher_name) teachers.add(c.teacher_name);
                        if (c.classroom) classrooms.add(c.classroom);
                        if (c.subject) subjects.add(c.subject);
                        if (c.grade) grades.add(c.grade);
                    });
                    
                    // 填充老师筛选
                    const teacherSelect = document.getElementById('filter-teacher');
                    const currentTeacher = teacherSelect.value;
                    teacherSelect.innerHTML = '<option value="">全部老师</option>';
                    Array.from(teachers).sort().forEach(teacher => {
                        const option = document.createElement('option');
                        option.value = teacher;
                        option.textContent = teacher;
                        teacherSelect.appendChild(option);
                    });
                    if (currentTeacher) teacherSelect.value = currentTeacher;
                    
                    // 填充教室筛选
                    const classroomSelect = document.getElementById('filter-classroom');
                    const currentClassroom = classroomSelect.value;
                    classroomSelect.innerHTML = '<option value="">全部教室</option>';
                    Array.from(classrooms).sort().forEach(classroom => {
                        const option = document.createElement('option');
                        option.value = classroom;
                        option.textContent = classroom;
                        classroomSelect.appendChild(option);
                    });
                    if (currentClassroom) classroomSelect.value = currentClassroom;
                    
                    // 填充科目筛选
                    const subjectSelect = document.getElementById('filter-subject');
                    const currentSubject = subjectSelect.value;
                    subjectSelect.innerHTML = '<option value="">全部科目</option>';
                    Array.from(subjects).sort().forEach(subject => {
                        const option = document.createElement('option');
                        option.value = subject;
                        option.textContent = subject;
                        subjectSelect.appendChild(option);
                    });
                    if (currentSubject) subjectSelect.value = currentSubject;
                    
                    // 填充年级筛选
                    const gradeSelect = document.getElementById('filter-grade');
                    const currentGrade = gradeSelect.value;
                    gradeSelect.innerHTML = '<option value="">全部年级</option>';
                    Array.from(grades).sort().forEach(grade => {
                        const option = document.createElement('option');
                        option.value = grade;
                        option.textContent = grade;
                        gradeSelect.appendChild(option);
                    });
                    if (currentGrade) gradeSelect.value = currentGrade;
                });
        }
        
        // 应用筛选条件
        function applyFilters() {
            loadCourses();
        }
        
        // 清除筛选条件
        function clearFilters() {
            document.getElementById('filter-teacher').value = '';
            document.getElementById('filter-classroom').value = '';
            document.getElementById('filter-subject').value = '';
            document.getElementById('filter-grade').value = '';
            loadCourses();
        }
        
        // 获取当前周的日期范围
        function getCurrentWeekDateRange() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                return null;
            }
            
            const [year, month] = monthInput.value.split('-').map(Number);
            const weekNum = parseInt(weekSelect.value);
            const firstDay = new Date(year, month - 1, 1);
            const firstDayWeekday = firstDay.getDay();
            const lastDay = new Date(year, month, 0);
            const monthEnd = lastDay.getDate();
            
            let startDate, endDate;
            
            if (weekNum === 1) {
                if (firstDayWeekday === 0) {
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month - 1, 1);
                } else {
                    // JavaScript getDay(): 0=周日, 1=周一, ..., 6=周六
                    // 计算到周日(0)需要多少天：(0 - firstDayWeekday + 7) % 7
                    const daysToSunday = (0 - firstDayWeekday + 7) % 7;
                    const firstSundayDate = Math.min(1 + daysToSunday, monthEnd);
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month - 1, firstSundayDate);
                }
            } else {
                // 计算第一个周一
                // JavaScript的getDay(): 0=周日, 1=周一, 2=周二, 3=周三, 4=周四, 5=周五, 6=周六
                let daysToMonday;
                if (firstDayWeekday === 0) {
                    // 1号是周日，第一个周一是2号
                    daysToMonday = 1;
                } else if (firstDayWeekday === 1) {
                    // 1号是周一，第一个周一就是1号
                    daysToMonday = 0;
                } else {
                    // 1号是周二到周六，计算到下一个周一需要多少天
                    // 周二(2) -> 周一需要6天, 周三(3) -> 周一需要5天, ..., 周六(6) -> 周一需要2天
                    daysToMonday = 8 - firstDayWeekday;
                }
                
                const firstMondayDate = 1 + daysToMonday;
                const startDateNum = firstMondayDate + (weekNum - 2) * 7;
                
                if (startDateNum > monthEnd) {
                    return null;
                }
                
                startDate = new Date(year, month - 1, startDateNum);
                // 一周的结束是周日，所以结束日期是开始日期（周一）+6天
                const calculatedEndDateNum = startDateNum + 6;
                const endDateNum = Math.min(calculatedEndDateNum, monthEnd);
                endDate = new Date(year, month - 1, endDateNum);
            }
            
            return { startDate, endDate, year, month };
        }
        
        // 获取下一周的日期范围
        function getNextWeekDateRange() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                return null;
            }
            
            const [year, month] = monthInput.value.split('-').map(Number);
            const weekNum = parseInt(weekSelect.value);
            const firstDay = new Date(year, month - 1, 1);
            const firstDayWeekday = firstDay.getDay();
            const lastDay = new Date(year, month, 0);
            const monthEnd = lastDay.getDate();
            
            const nextWeekNum = weekNum + 1;
            let startDate, endDate;
            
            // 检查下一周是否在当前月内
            if (weekNum === 1) {
                // 当前是第1周，下一周是第2周
                // 计算第一个周一
                let daysToMonday;
                if (firstDayWeekday === 0) {
                    // 1号是周日，第一个周一是2号
                    daysToMonday = 1;
                } else if (firstDayWeekday === 1) {
                    // 1号是周一，第一个周一就是1号
                    daysToMonday = 0;
                } else {
                    // 1号是周二到周六，计算到下一个周一需要多少天
                    daysToMonday = 8 - firstDayWeekday;
                }
                
                const firstMondayDate = 1 + daysToMonday;
                const startDateNum = firstMondayDate;
                
                if (startDateNum > monthEnd) {
                    return null;
                }
                
                startDate = new Date(year, month - 1, startDateNum);
                // 一周的结束是周日，所以结束日期是开始日期（周一）+6天
                const endDateNum = Math.min(startDateNum + 6, monthEnd);
                endDate = new Date(year, month - 1, endDateNum);
            } else {
                // 当前是第2周及以后，下一周是weekNum + 1
                // 计算第一个周一
                let daysToMonday;
                if (firstDayWeekday === 0) {
                    // 1号是周日，第一个周一是2号
                    daysToMonday = 1;
                } else if (firstDayWeekday === 1) {
                    // 1号是周一，第一个周一就是1号
                    daysToMonday = 0;
                } else {
                    // 1号是周二到周六，计算到下一个周一需要多少天
                    daysToMonday = 8 - firstDayWeekday;
                }
                
                const firstMondayDate = 1 + daysToMonday;
                const startDateNum = firstMondayDate + (nextWeekNum - 2) * 7;
                
                // 如果下一周超出当前月，检查是否在下一个月
                if (startDateNum > monthEnd) {
                    // 下一周在下一个月
                    const nextMonth = month === 12 ? 1 : month + 1;
                    const nextYear = month === 12 ? year + 1 : year;
                    const nextMonthFirstDay = new Date(nextYear, nextMonth - 1, 1);
                    const nextMonthFirstDayWeekday = nextMonthFirstDay.getDay();
                    const nextMonthLastDay = new Date(nextYear, nextMonth, 0);
                    const nextMonthEnd = nextMonthLastDay.getDate();
                    
                    // 计算下一月第1周的日期范围
                    if (nextMonthFirstDayWeekday === 0) {
                        startDate = nextMonthFirstDay;
                        endDate = nextMonthFirstDay;
                    } else {
                        // 计算到周日需要多少天：7 - nextMonthFirstDayWeekday
                        const daysToSunday = 7 - nextMonthFirstDayWeekday;
                        const firstSundayDate = Math.min(1 + daysToSunday, nextMonthEnd);
                        startDate = nextMonthFirstDay;
                        endDate = new Date(nextYear, nextMonth - 1, firstSundayDate);
                    }
                    
                    return { startDate, endDate, year: nextYear, month: nextMonth };
                }
                
                startDate = new Date(year, month - 1, startDateNum);
                // 一周的结束是周日，所以结束日期是开始日期（周一）+6天
                const endDateNum = Math.min(startDateNum + 6, monthEnd);
                endDate = new Date(year, month - 1, endDateNum);
            }
            
            return { startDate, endDate, year, month };
        }
        
        // 获取下下周的日期范围（基于下一周的日期范围）
        function getNextNextWeekDateRange(nextWeekRange) {
            if (!nextWeekRange) return null;
            
            const nextYear = nextWeekRange.year;
            const nextMonth = nextWeekRange.month;
            const nextStart = nextWeekRange.startDate;
            const nextEnd = nextWeekRange.endDate;
            
            // 计算下下周：从下一周的结束日期+1天开始，往后7天
            const nextNextStart = new Date(nextEnd);
            nextNextStart.setDate(nextNextStart.getDate() + 1);
            
            const nextNextEnd = new Date(nextNextStart);
            nextNextEnd.setDate(nextNextEnd.getDate() + 6);
            
            // 检查是否跨月
            const nextNextYear = nextNextStart.getFullYear();
            const nextNextMonth = nextNextStart.getMonth() + 1;
            
            return {
                startDate: nextNextStart,
                endDate: nextNextEnd,
                year: nextNextYear,
                month: nextNextMonth
            };
        }
        
        // 切换到上一周
        function goToPreviousWeek() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                alert('请先选择月份和周');
                return;
            }
            
            const [year, month] = monthInput.value.split('-').map(Number);
            const weekNum = parseInt(weekSelect.value);
            
            if (weekNum > 1) {
                // 上一周在当前月内
                weekSelect.value = weekNum - 1;
                updateWeekInfo();
                loadCourses();
            } else {
                // 上一周在上一个月
                let prevMonth, prevYear;
                if (month === 1) {
                    prevMonth = 12;
                    prevYear = year - 1;
                } else {
                    prevMonth = month - 1;
                    prevYear = year;
                }
                
                // 切换到上一月
                monthInput.value = `${prevYear}-${String(prevMonth).padStart(2, '0')}`;
                
                // 更新周选择器选项
                updateWeekOptions();
                
                // 获取上一月的最大周数
                const prevMonthFirstDay = new Date(prevYear, prevMonth - 1, 1);
                const prevMonthFirstDayWeekday = prevMonthFirstDay.getDay();
                const prevMonthLastDay = new Date(prevYear, prevMonth, 0);
                const prevMonthEnd = prevMonthLastDay.getDate();
                
                let maxWeeks = 1;
                
                if (prevMonthFirstDayWeekday === 0) {
                    // 1号是周日，第1周只有1号
                    const firstMonday = new Date(prevYear, prevMonth - 1, 2);
                    let currentMonday = new Date(firstMonday);
                    let weekNum = 2;
                    
                    while (currentMonday.getDate() <= prevMonthEnd && weekNum <= 5) {
                        maxWeeks = weekNum;
                        currentMonday = new Date(currentMonday);
                        currentMonday.setDate(currentMonday.getDate() + 7);
                        weekNum++;
                    }
                } else {
                    // 第1周：1号到第一个周日
                    maxWeeks = 1;
                    
                    const daysToMonday = 7 - prevMonthFirstDayWeekday;
                    const firstMonday = new Date(prevYear, prevMonth - 1, 1 + daysToMonday);
                    let currentMonday = new Date(firstMonday);
                    let weekNum = 2;
                    
                    while (currentMonday.getDate() <= prevMonthEnd && weekNum <= 5) {
                        maxWeeks = weekNum;
                        currentMonday = new Date(currentMonday);
                        currentMonday.setDate(currentMonday.getDate() + 7);
                        weekNum++;
                    }
                }
                
                // 设置为上一月的最后一周
                weekSelect.value = maxWeeks;
                updateWeekInfo();
                loadCourses();
            }
        }
        
        // 切换到下一周
        function goToNextWeek() {
            const monthInput = document.getElementById('course-month');
            const weekSelect = document.getElementById('course-week-select');
            
            if (!monthInput || !weekSelect || !monthInput.value || !weekSelect.value) {
                alert('请先选择月份和周');

            }
            
            const [year, month] = monthInput.value.split('-').map(Number);
            const weekNum = parseInt(weekSelect.value);
            
            // 计算当前月的最大周数
            const firstDay = new Date(year, month - 1, 1);
            const firstDayWeekday = firstDay.getDay();
            const lastDay = new Date(year, month, 0);
            const monthEnd = lastDay.getDate();
            
            let maxWeeks = 1;
            
            if (firstDayWeekday === 0) {
                // 1号是周日，第1周只有1号
                const firstMonday = new Date(year, month - 1, 2);
                let currentMonday = new Date(firstMonday);
                let weekNumCalc = 2;
                
                while (currentMonday.getDate() <= monthEnd && weekNumCalc <= 5) {
                    maxWeeks = weekNumCalc;
                    currentMonday = new Date(currentMonday);
                    currentMonday.setDate(currentMonday.getDate() + 7);
                    weekNumCalc++;
                }
            } else {
                // 第1周：1号到第一个周日
                maxWeeks = 1;
                
                const daysToMonday = 7 - firstDayWeekday;
                const firstMonday = new Date(year, month - 1, 1 + daysToMonday);
                let currentMonday = new Date(firstMonday);
                let weekNumCalc = 2;
                
                while (currentMonday.getDate() <= monthEnd && weekNumCalc <= 5) {
                    maxWeeks = weekNumCalc;
                    currentMonday = new Date(currentMonday);
                    currentMonday.setDate(currentMonday.getDate() + 7);
                    weekNumCalc++;
                }
            }
            
            if (weekNum < maxWeeks) {
                // 下一周在当前月内
                weekSelect.value = weekNum + 1;
                updateWeekInfo();
                loadCourses();
            } else {
                // 下一周在下一个月
                let nextMonth, nextYear;
                if (month === 12) {
                    nextMonth = 1;
                    nextYear = year + 1;
                } else {
                    nextMonth = month + 1;
                    nextYear = year;
                }
                
                // 切换到下一月
                monthInput.value = `${nextYear}-${String(nextMonth).padStart(2, '0')}`;
                
                // 更新周选择器选项
                updateWeekOptions();
                
                // 设置为下一月的第1周
                weekSelect.value = 1;
                updateWeekInfo();
                loadCourses();
            }
        }
        
        // 获取指定月份和周数的日期范围
        function getSpecifiedWeekDateRange(monthValue, weekNum) {
            if (!monthValue || !weekNum) {
                return null;
            }
            
            const [year, month] = monthValue.split('-').map(Number);
            const weekNumber = parseInt(weekNum);
            const firstDay = new Date(year, month - 1, 1);
            const firstDayWeekday = firstDay.getDay();
            const lastDay = new Date(year, month, 0);
            const monthEnd = lastDay.getDate();
            
            let startDate, endDate;
            
            if (weekNumber === 1) {
                // 第1周：从1号开始，到第一个周日结束
                if (firstDayWeekday === 0) {
                    // 1号是周日，第1周只有1号
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month - 1, 1);
                } else {
                    // 计算到周日需要多少天：7 - firstDayWeekday
                    const daysToSunday = 7 - firstDayWeekday;
                    const firstSundayDate = Math.min(1 + daysToSunday, monthEnd);
                    startDate = new Date(year, month - 1, 1);
                    endDate = new Date(year, month - 1, firstSundayDate);
                }
            } else {
                // 第2周及以后：从第一个周一开始
                let daysToMonday;
                if (firstDayWeekday === 0) {
                    // 1号是周日，第一个周一是2号
                    daysToMonday = 1;
                } else if (firstDayWeekday === 1) {
                    // 1号是周一，第一个周一就是1号
                    daysToMonday = 0;
                } else {
                    // 1号是周二到周六，计算到下一个周一需要多少天
                    daysToMonday = 8 - firstDayWeekday;
                }
                
                const firstMondayDate = 1 + daysToMonday;
                const startDateNum = firstMondayDate + (weekNumber - 2) * 7;
                
                // 如果开始日期超出月份，说明该周不存在
                if (startDateNum > monthEnd) {
                    return null;
                }
                
                startDate = new Date(year, month - 1, startDateNum);
                // 一周的结束是周日，所以结束日期是开始日期（周一）+6天
                const endDateNum = Math.min(startDateNum + 6, monthEnd);
                endDate = new Date(year, month - 1, endDateNum);
            }
            
            return { startDate, endDate, year, month };
        }
