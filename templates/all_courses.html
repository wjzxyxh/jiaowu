<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部排课 - 教务管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>全部排课</h1>
        </header>

        <main>
            <div class="page-header">
                <button class="btn-back" onclick="closeWindowOrGoHome()">← 关闭窗口</button>
            </div>
            <div class="toolbar">
                <button class="btn btn-primary" onclick="showAddCourseModal()">新增排课</button>
            </div>
            <div class="filter-bar" style="margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 6px; display: flex; flex-direction: column; gap: 10px;">
                <!-- 第一行：筛选条件 -->
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <label style="font-weight: bold;">筛选：</label>
                    <input type="text" id="filter-student-name" placeholder="学生姓名" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; width: 120px;">
                    <select id="filter-teacher" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">全部老师</option>
                    </select>
                    <select id="filter-subject" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">全部科目</option>
                    </select>
                    <select id="filter-grade" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">全部年级</option>
                    </select>
                    <label>开始日期：</label>
                    <input type="date" id="filter-date-start" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <label>结束日期：</label>
                    <input type="date" id="filter-date-end" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <select id="filter-status" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">全部状态</option>
                        <option value="正常">正常</option>
                        <option value="请假">请假</option>
                        <option value="跑空">跑空</option>
                    </select>
                    <label style="font-weight: bold;">排序：</label>
                    <select id="filter-order-by" onchange="applyFilters()" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="desc">日期降序（最新在前）</option>
                        <option value="asc">日期升序（最早在前）</option>
                    </select>
                    <button class="btn btn-secondary" onclick="clearFilters()" style="padding: 6px 12px;">清除筛选</button>
                </div>
                <!-- 第二行：批量操作按钮 -->
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn btn-success" id="batch-confirm-btn" onclick="batchConfirmAllCourses()" style="background: #28a745; color: white; padding: 6px 12px;">批量确认</button>
                    <button class="btn btn-secondary" id="batch-cancel-btn" onclick="batchCancelConfirmAllCourses()" style="background: #6c757d; color: white; padding: 6px 12px;">批量取消</button>
                    <button class="btn btn-danger" id="batch-delete-btn" onclick="batchDeleteCourses()" style="padding: 6px 12px;">批量删除</button>
                    <button class="btn btn-info" onclick="showStatistics()" style="background: #17a2b8; color: white; padding: 6px 12px;">统计</button>
                </div>
            </div>
            <div id="courses-list-view">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll()"></th>
                            <th>序号</th>
                            <th>学生姓名</th>
                            <th>年级</th>
                            <th>科目</th>
                            <th>课程名称</th>
                            <th>老师</th>
                            <th>日期</th>
                            <th>星期</th>
                            <th>时段</th>
                            <th>状态</th>
                            <th>确认</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="courses-table-body">
                        <!-- 初始占位行，用于测试 -->
                        <tr><td colspan="13" style="text-align: center; padding: 20px; color: #999;">正在加载数据...</td></tr>
                    </tbody>
                </table>
                <!-- 分页控件 -->
                <div id="courses-pagination" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <button class="btn btn-secondary" id="courses-prev-btn" onclick="coursesPreviousPage()" disabled>上一页</button>
                    <span id="courses-page-info" style="padding: 0 15px;">第 1 页，共 1 页</span>
                    <button class="btn btn-secondary" id="courses-next-btn" onclick="coursesNextPage()" disabled>下一页</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        // 全局API错误处理：检测会话失效
        let sessionExpiredHandled = false; // 防止重复弹窗
        
        (function() {
            // 保存原始的fetch函数
            const originalFetch = window.fetch;
            
            // 重写fetch函数，添加全局错误处理
            window.fetch = function(...args) {
                return originalFetch.apply(this, args)
                    .then(async response => {
                        // 检查是否是401错误
                        if (response.status === 401 && !sessionExpiredHandled) {
                            try {
                                const data = await response.json();
                                if (data.session_expired) {
                                    sessionExpiredHandled = true;
                                    
                                    // 显示确认弹窗
                                    const confirmed = confirm('您的账号在其他地方登录，当前会话已失效。\n\n点击"确定"将跳转到登录页面重新登录。\n点击"取消"可以继续浏览（但操作可能失败）。');
                                    
                                    if (confirmed) {
                                        // 用户确认，清除本地数据并跳转到登录页
                                        console.warn('用户确认会话失效，跳转到登录页');
                                        localStorage.clear();
                                        sessionStorage.clear();
                                        window.location.href = '/login';
                                    } else {
                                        // 用户取消，重置标志，允许继续操作（但可能会失败）
                                        console.warn('用户取消跳转，继续当前会话（操作可能失败）');
                                        sessionExpiredHandled = false;
                                    }
                                    
                                    // 返回一个rejected promise，阻止后续处理
                                    return Promise.reject(new Error('Session expired'));
                                }
                            } catch (e) {
                                // 如果解析JSON失败，继续处理
                            }
                        }
                        return Promise.resolve(response);
                    });
            };
        })();
        
        // ============================================
        // 立即测试：确保脚本能执行（必须在最前面）
        // ============================================
        try {
            console.log('=== all_courses.html 脚本开始加载 ===');
            console.log('当前时间:', new Date().toISOString());
            console.log('浏览器:', navigator.userAgent);
            console.log('页面URL:', window.location.href);
            
            // 测试基本功能
            if (typeof console !== 'undefined') {
                console.log('✓ console 对象可用');
            } else {
                alert('错误：console 对象不可用！');
            }
            
            // 测试 DOM 是否可用
            if (typeof document !== 'undefined') {
                console.log('✓ document 对象可用');
            } else {
                alert('错误：document 对象不可用！');
            }
        } catch (e) {
            alert('脚本初始化错误: ' + e.message);
            console.error('脚本初始化错误:', e);
        }
        
        // 关闭窗口或返回首页（简化版本，确保能立即工作）
        function closeWindowOrGoHome() {
            try {
                console.log('closeWindowOrGoHome 函数被调用');
                
                // 如果模态框是打开的，先关闭它
                const modal = document.getElementById('modal');
                if (modal && modal.classList.contains('show')) {
                    console.log('检测到模态框打开，先关闭模态框');
                    if (typeof closeModal === 'function') {
                        closeModal();
                    } else {
                        modal.classList.remove('show');
                        modal.style.display = 'none';
                    }
                    // 等待模态框关闭动画完成后再执行关闭窗口操作
                    setTimeout(function() {
                        performCloseWindow();
                    }, 300);
                    return;
                }
                
                // 直接执行关闭窗口操作
                performCloseWindow();
            } catch (e) {
                console.error('closeWindowOrGoHome 错误:', e);
                // 如果出错，直接跳转
                window.location.href = '/';
            }
        }
        
        // 执行关闭窗口操作（简化版本）
        function performCloseWindow() {
            try {
                console.log('执行关闭窗口操作');
                // 直接跳转到首页（更可靠）
                window.location.href = '/';
            } catch (e) {
                console.error('关闭窗口失败:', e);
                // 如果出错，尝试直接跳转
                try {
                    window.location.href = '/';
                } catch (e2) {
                    alert('无法关闭窗口，请手动返回首页');
                }
            }
        }
        
        // 确保函数在全局作用域可用（立即绑定）
        window.closeWindowOrGoHome = closeWindowOrGoHome;
        window.performCloseWindow = performCloseWindow;
        
        // 立即测试函数是否可用
        console.log('closeWindowOrGoHome 函数已定义并绑定到 window');
        console.log('测试函数可用性:', typeof window.closeWindowOrGoHome === 'function' ? '✓ 可用' : '✗ 不可用');
        
        // 继续执行脚本
        console.log('=== all_courses.html 脚本继续执行 ===');
        console.log('函数定义完成，开始初始化变量');
        
        // 分页相关变量（必须在函数定义之前）
        let allCoursesAllData = [];
        let allCoursesCurrentPage = 1;
        let allCoursesTotal = 0;
        let allCoursesTotalPages = 1;
        // currentUserRole 已在 app.js 中声明，这里不再重复声明
        // 如果 app.js 中未定义，则初始化为 null
        if (typeof currentUserRole === 'undefined') {
            window.currentUserRole = null;
        }
        const allCoursesPageSize = 20; // 每页20条记录
        
        console.log('变量初始化完成');
        
        // 立即测试：尝试直接加载数据（不依赖 DOMContentLoaded）
        // 这可以帮助诊断问题
        if (document.readyState === 'loading') {
            console.log('文档仍在加载中，等待 DOMContentLoaded');
        } else {
            console.log('文档已加载完成，可以立即尝试加载数据');
            // 如果文档已经加载完成，立即尝试加载数据
            setTimeout(function() {
                const tbody = document.getElementById('courses-table-body');
                if (tbody && typeof loadAllCourses === 'function') {
                    console.log('文档已就绪，立即调用 loadAllCourses');
                    try {
                        loadAllCourses();
                    } catch (err) {
                        console.error('立即加载失败:', err);
                    }
                }
            }, 100);
        }
        
        // 页面加载时初始化
        console.log('注册 DOMContentLoaded 事件监听器');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== DOMContentLoaded 事件触发 ===');
            console.log('=== 页面加载完成，开始初始化 ===');
            const tbody = document.getElementById('courses-table-body');
            console.log('检查表格元素:', tbody ? '找到' : '未找到');
            if (tbody) {
                console.log('tbody 元素详情:', {
                    id: tbody.id,
                    tagName: tbody.tagName,
                    parentElement: tbody.parentElement ? tbody.parentElement.tagName : '无',
                    childrenCount: tbody.children.length
                });
            }
            
            // 确保刷新时清除所有筛选条件（除了排序）
            // 这样可以确保刷新后显示所有数据
            const filterDateStart = document.getElementById('filter-date-start');
            const filterDateEnd = document.getElementById('filter-date-end');
            if (filterDateStart && filterDateStart.value) {
                console.log('检测到开始日期筛选:', filterDateStart.value);
            }
            if (filterDateEnd && filterDateEnd.value) {
                console.log('检测到结束日期筛选:', filterDateEnd.value);
            }
            
            // 加载财务配置和统计数据（后台加载，不阻塞数据加载）
            fetch('/api/finance-config')
                .then(res => res.json())
                .then(configs => {
                    const reminderConfig = configs.find(c => c.key === 'min_hours_for_reminder');
                    const reminderThreshold = reminderConfig ? reminderConfig.value : 3;
                    window.minHoursForReminder = reminderThreshold;
                    
                    // 加载课时统计数据（用于检查剩余课时）
                    const today = new Date();
                    const month = today.toISOString().slice(0, 7);
                    return fetch(`/api/stats?month=${month}`);
                })
                .then(res => res.json())
                .then(stats => {
                    // 创建剩余课时映射
                    window.remainingHoursMap = {};
                    stats.forEach(s => {
                        const key = s.course_id ? `${s.student_id}-${s.course_id}` : s.student_id;
                        if (!window.remainingHoursMap[key] || s.remaining_hours > window.remainingHoursMap[key]) {
                            window.remainingHoursMap[key] = s.remaining_hours || 0;
                        }
                    });
                })
                .catch(err => {
                    console.error('加载配置或统计数据失败:', err);
                })
                .finally(() => {
                    console.log('开始初始化筛选选项');
                    initAllCoursesFilters();
                });
            
            // 立即加载数据
            console.log('=== 页面初始化：准备加载数据 ===');
            
            // 立即更新占位文本
            const tbodyPlaceholder = document.getElementById('courses-table-body');
            if (tbodyPlaceholder) {
                tbodyPlaceholder.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: #666; font-weight: bold;">正在加载数据，请稍候...</td></tr>';
                console.log('✓ 已更新占位文本');
            } else {
                console.error('✗ 找不到 tbody 元素，无法更新占位文本');
                alert('错误：找不到表格元素！请检查页面HTML结构。');
                return; // 如果找不到元素，直接返回
            }
            
            // 直接尝试加载数据（不依赖延迟）
            console.log('准备直接加载数据...');
            
            // 方案1：立即尝试调用（如果函数已定义）
            if (typeof loadAllCourses === 'function') {
                console.log('✓ loadAllCourses 函数已存在，立即调用');
                try {
                    loadAllCourses();
                } catch (err) {
                    console.error('✗ 调用 loadAllCourses 失败:', err);
                    console.error('错误堆栈:', err.stack);
                    const tbody = document.getElementById('courses-table-body');
                    if (tbody) {
                        tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">加载数据失败: ' + (err.message || '未知错误') + '<br><button onclick="location.reload()" style="margin-top: 10px; padding: 5px 15px;">刷新页面</button></td></tr>';
                    }
                }
            } else {
                console.warn('⚠ loadAllCourses 函数尚未定义，等待延迟调用...');
                // 延迟调用 loadAllCourses，确保函数已经定义
                setTimeout(function() {
                    console.log('延迟调用 loadAllCourses，检查函数是否存在...');
                    if (typeof loadAllCourses === 'function') {
                        console.log('✓ loadAllCourses 函数存在，开始调用');
                        try {
                            loadAllCourses();
                        } catch (err) {
                            console.error('✗ 调用 loadAllCourses 失败:', err);
                            console.error('错误堆栈:', err.stack);
                            const tbody = document.getElementById('courses-table-body');
                            if (tbody) {
                                tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">加载数据失败: ' + (err.message || '未知错误') + '<br><button onclick="location.reload()" style="margin-top: 10px; padding: 5px 15px;">刷新页面</button></td></tr>';
                            }
                        }
                    } else {
                        console.error('✗✗✗ loadAllCourses 函数仍未定义！');
                        console.error('当前 window 对象上的函数:', Object.keys(window).filter(k => typeof window[k] === 'function').slice(0, 20));
                        const tbody = document.getElementById('courses-table-body');
                        if (tbody) {
                            tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">页面脚本加载错误：loadAllCourses 函数未定义<br>请刷新页面重试<br><button onclick="location.reload()" style="margin-top: 10px; padding: 5px 15px;">刷新页面</button></td></tr>';
                        }
                    }
                }, 1000); // 延迟1秒，确保函数已经定义
            }
            
            // 方案2：延迟调用 loadAllCourses（作为备用方案）
            // 如果方案1失败，使用这个备用方案
            setTimeout(function() {
                console.log('方案2：检查数据是否已加载...');
                const tbody = document.getElementById('courses-table-body');
                if (tbody) {
                    const rows = tbody.querySelectorAll('tr');
                    const hasData = rows.length > 0 && !tbody.textContent.includes('正在加载数据');
                    
                    if (!hasData && typeof loadAllCourses === 'function') {
                        console.log('方案1可能失败，使用备用方案 loadAllCourses');
                        try {
                            loadAllCourses();
                        } catch (err) {
                            console.error('备用方案也失败:', err);
                            tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">数据加载失败，请刷新页面重试<br><button onclick="location.reload()" style="margin-top: 10px; padding: 5px 15px;">刷新页面</button></td></tr>';
                        }
                    } else if (hasData) {
                        console.log('数据已成功加载，无需使用备用方案');
                    } else {
                        console.warn('loadAllCourses 函数未定义，无法使用备用方案');
                    }
                }
            }, 2000); // 2秒后检查，给方案1足够的时间
        });
        
        // 手动渲染函数（备用方案，定义在全局作用域）
        function renderDataManually(courses, totalPages, total) {
            console.log('=== renderDataManually 开始执行 ===');
            console.log('传入参数 - courses数量:', courses ? courses.length : 0, 'totalPages:', totalPages, 'total:', total);
            
            const tbody = document.getElementById('courses-table-body');
            if (!tbody) {
                console.error('错误：找不到 courses-table-body 元素！');
                alert('错误：找不到表格元素！页面结构可能有问题。');
                return;
            }
            
            console.log('找到 tbody 元素，开始清空并渲染');
            tbody.innerHTML = '';
            
            if (!courses || courses.length === 0) {
                console.log('没有课程数据，显示"暂无数据"');
                const tr = document.createElement('tr');
                tr.innerHTML = '<td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">暂无数据</td>';
                tbody.appendChild(tr);
                console.log('已添加"暂无数据"行');
                return;
            }
            
            console.log('开始渲染', courses.length, '条课程数据');
                
                courses.forEach((course, index) => {
                    const tr = document.createElement('tr');
                    const rowNum = index + 1;
                    const courseDate = course.course_date ? new Date(course.course_date + 'T00:00:00') : null;
                    const dateStr = courseDate ? `${courseDate.getFullYear()}-${String(courseDate.getMonth() + 1).padStart(2, '0')}-${String(courseDate.getDate()).padStart(2, '0')}` : course.course_date || '';
                    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                    const weekday = courseDate ? weekdays[courseDate.getDay()] : (course.weekday || '');
                    
                    tr.innerHTML = `
                        <td><input type="checkbox" class="course-checkbox" value="${course.id}" onchange="updateBatchDeleteButton()"></td>
                        <td>${rowNum}</td>
                        <td>${course.student_name || ''}</td>
                        <td>${course.grade || ''}</td>
                        <td>${course.subject || ''}</td>
                        <td>${course.course_name || course.subject || ''}</td>
                        <td>${course.teacher_name || ''}</td>
                        <td>${dateStr}</td>
                        <td>${weekday}</td>
                        <td>${course.time_slot || ''}</td>
                        <td>
                            <select onchange="updateCourseStatus(${course.id}, this.value)" style="padding: 4px; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="正常" ${course.status === '正常' ? 'selected' : ''}>正常</option>
                                <option value="请假" ${course.status === '请假' ? 'selected' : ''}>请假</option>
                                <option value="跑空" ${course.status === '跑空' ? 'selected' : ''}>跑空</option>
                            </select>
                        </td>
                        <td>
                            ${course.is_confirmed ? 
                                '<button class="btn btn-secondary" onclick="confirmCourseForAllCourses(' + course.id + ')" style="background: #6c757d; color: white; padding: 4px 8px; font-size: 12px;">取消确认</button>' : 
                                '<button class="btn btn-success" onclick="confirmCourseForAllCourses(' + course.id + ')" style="background: #28a745; color: white; padding: 4px 8px; font-size: 12px;">确认上课</button>'
                            }
                        </td>
                        <td>
                            ${(!course.is_confirmed || (currentUserRole === 'admin')) ? 
                                '<button class="btn btn-sm btn-primary" onclick="showEditCourseModal(' + course.id + ')">编辑</button>' :
                                '<button class="btn btn-sm btn-primary" disabled title="无权限编辑已确认上课的排课，只有管理员可以编辑" style="opacity: 0.5; cursor: not-allowed;">编辑</button>'
                            }
                            ${(!course.is_confirmed || (currentUserRole === 'admin')) ? 
                                '<button class="btn btn-sm btn-danger" onclick="deleteCourse(' + course.id + ')">删除</button>' :

        // 初始化筛选选项
        function initAllCoursesFilters() {

            fetch('/api/all_courses?page=1&per_page=1000')
                .then(res => res.json())
                .then(data => {
                    const courses = data.courses || [];
                    
                    // 提取唯一的选项
                    const teachers = new Set();
                    const subjects = new Set();
                    const grades = new Set();
                    
                    courses.forEach(c => {
                        if (c.teacher_name) teachers.add(c.teacher_name);
                        if (c.subject) subjects.add(c.subject);
                        if (c.grade) grades.add(c.grade);
                    });
                    
                    // 填充老师筛选
                    const teacherSelect = document.getElementById('filter-teacher');
                    const currentTeacher = teacherSelect.value;
                    teacherSelect.innerHTML = '<option value="">全部老师</option>';
                    Array.from(teachers).sort().forEach(teacher => {
                        const option = document.createElement('option');
                        option.value = teacher;
                        option.textContent = teacher;
                        teacherSelect.appendChild(option);
                    });
                    if (currentTeacher) teacherSelect.value = currentTeacher;
                    
                    // 填充科目筛选
                    const subjectSelect = document.getElementById('filter-subject');
                    const currentSubject = subjectSelect.value;
                    subjectSelect.innerHTML = '<option value="">全部科目</option>';
                    Array.from(subjects).sort().forEach(subject => {
                        const option = document.createElement('option');
                        option.value = subject;
                        option.textContent = subject;
                        subjectSelect.appendChild(option);
                    });
                    if (currentSubject) subjectSelect.value = currentSubject;
                    
                    // 填充年级筛选
                    const gradeSelect = document.getElementById('filter-grade');
                    const currentGrade = gradeSelect.value;
                    gradeSelect.innerHTML = '<option value="">全部年级</option>';
                    Array.from(grades).sort().forEach(grade => {
                        const option = document.createElement('option');
                        option.value = grade;
                        option.textContent = grade;
                        gradeSelect.appendChild(option);
                    });
                    if (currentGrade) gradeSelect.value = currentGrade;
                })
                .catch(err => {
                    console.error('初始化筛选选项失败:', err);

            console.log('发送 fetch 请求到:', url);
            
            fetch(url, {

                    'Accept': 'application/json',

                credentials: 'same-origin'
            })
                .then(res => {

                    console.log('响应 Content-Type:', res.headers.get('content-type'));
                    
                    if (!res.ok) {
                        console.error('✗ API 返回错误状态:', res.status);
                        return res.text().then(text => {
                            console.error('API 返回错误，响应内容:', text.substring(0, 500));
                            try {
                                const errorData = JSON.parse(text);
                                throw new Error(errorData.error || `HTTP ${res.status} 错误`);
                            } catch (e) {
                                if (e instanceof Error && e.message.includes('HTTP')) {
                                    throw e;
                                }
                                throw new Error(`HTTP ${res.status}: ${res.statusText}\n响应: ${text.substring(0, 200)}`);
                            }
                        });
                    }

        // 渲染表格（平滑更新，不闪烁）

                    tbody.innerHTML = '';

                    isRefreshing = false;
                    console.log('已添加"暂无数据"行');

                    // 如果已确认，设置行样式
                    if (course.is_confirmed) {
                        tr.setAttribute('style', 'background-color: #f5f5f5; color: #666; opacity: 0.8;');
                    }
                    fragment.appendChild(tr);
                    renderedCount++;
                    if (renderedCount === 1) {
                        console.log('✓ 第一条数据已渲染');
                    }
                } catch (err) {
                    console.error('渲染第', index + 1, '条数据时出错:', err);
                }
            });
            
            // 使用 requestAnimationFrame 确保在下一帧一次性替换，避免闪烁
            requestAnimationFrame(() => {
                tbody.innerHTML = '';
                tbody.appendChild(fragment);
                isRefreshing = false;
                console.log('✓ 渲染完成，已更新', renderedCount, '行数据');
            });
            
            // 验证渲染结果（延迟执行，确保DOM已更新）
            setTimeout(() => {
                const renderedRows = tbody.querySelectorAll('tr');
                console.log('验证：tbody 中实际渲染的行数:', renderedRows.length);
                if (renderedRows.length === 0 && courses.length > 0) {
                    console.error('警告：数据存在但未渲染任何行！');
                    // 强制显示错误信息
                    tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">渲染失败：数据存在但无法显示，请刷新页面重试</td></tr>';
                    isRefreshing = false;
                } else if (renderedRows.length > 0) {
                    console.log('✓✓✓ 渲染成功！已显示', renderedRows.length, '行数据');
                }
            }, 50);
            
            // 更新批量删除按钮状态
            if (typeof updateBatchDeleteButton === 'function') {
                updateBatchDeleteButton();
            }
            
            // 渲染完成后，重新绑定所有函数（确保按钮可用）
            console.log('渲染完成，准备重新绑定所有函数');
            setTimeout(() => {
                if (typeof rebindAllFunctions === 'function') {
                    console.log('执行 rebindAllFunctions');
                    rebindAllFunctions();
                    
                    // 验证绑定结果
                    console.log('验证绑定结果:');
                    console.log('  batchConfirmAllCourses:', typeof window.batchConfirmAllCourses);
                    console.log('  batchCancelConfirmAllCourses:', typeof window.batchCancelConfirmAllCourses);
                    console.log('  batchDeleteCourses:', typeof window.batchDeleteCourses);
                    console.log('  showStatistics:', typeof window.showStatistics);
                } else {
                    console.warn('rebindAllFunctions 函数未定义，使用直接绑定');
                    // 直接绑定，不检查类型
                    window.batchConfirmAllCourses = batchConfirmAllCourses;
                    window.batchCancelConfirmAllCourses = batchCancelConfirmAllCourses;
                    window.batchDeleteCourses = batchDeleteCourses;
                    window.showStatistics = showStatistics;
                    window.closeWindowOrGoHome = closeWindowOrGoHome;
                    console.log('✓ 已直接绑定关键函数');
                }
            }, 200); // 增加延迟，确保所有函数都已定义
        }

        // 批量确认
        function batchConfirmAllCourses() {
            console.log('batchConfirmAllCourses 函数被调用');
            const checkboxes = document.querySelectorAll('.course-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请先选择要确认的排课');
                return;
            }
            
            // 获取选中的课程ID，并检查哪些是未确认的
            const selectedIds = [];
            const alreadyConfirmedIds = [];
            
            checkboxes.forEach(cb => {
                const courseId = parseInt(cb.value);
                const row = cb.closest('tr');
                if (row) {
                    // 查找确认按钮
                    const confirmBtn = row.querySelector('button[onclick*="confirmCourseForAllCourses"]');
                    if (confirmBtn && confirmBtn.textContent.includes('确认上课')) {
                        // 未确认的课程
                        selectedIds.push(courseId);
                    } else if (confirmBtn && confirmBtn.textContent.includes('取消确认')) {
                        // 已确认的课程
                        alreadyConfirmedIds.push(courseId);
                    }
                }
            });
            
            if (selectedIds.length === 0) {
                if (alreadyConfirmedIds.length > 0) {
                    alert('选中的排课都已确认，无需再次确认');
                } else {
                    alert('请先选择要确认的排课');
                }
                return;
            }
            
            if (!confirm(`确定要批量确认 ${selectedIds.length} 个排课吗？确认后将扣除剩余课时。`)) {
                return;
            }
            
            // 验证 selectedIds
            if (selectedIds.length === 0) {
                alert('没有可确认的排课');
                return;
            }
            
            // 验证所有 ID 都是有效数字
            const validIds = selectedIds.filter(id => !isNaN(id) && id > 0);
            if (validIds.length !== selectedIds.length) {
                alert('包含无效的排课ID，请刷新页面后重试');
                return;
            }
            
            console.log('发送批量确认请求:', { course_ids: validIds });
            
            fetch('/api/courses/batch-confirm', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ course_ids: validIds })
            })
            .then(res => {
                console.log('响应状态:', res.status, res.statusText);
                console.log('响应头:', res.headers);
                
                // 检查响应状态
                if (!res.ok) {
                    // 尝试解析错误消息
                    return res.text().then(text => {
                        try {
                            const errorData = JSON.parse(text);
                            throw new Error(errorData.error || `请求失败: ${res.status} ${res.statusText}`);
                        } catch (e) {
                            if (e instanceof Error && e.message.includes('请求失败')) {
                                throw e;
                            }
                            throw new Error(`请求失败: ${res.status} ${res.statusText}\n${text}`);
                        }
                    });
                }
                return res.json();
            })
            .then(data => {
                console.log('响应数据:', data);
                if (data.error) {
                    alert('批量确认失败：' + data.error);
                    return;
                }
                
                let message = `成功确认 ${data.confirmed_count} 个排课`;
                if (data.already_confirmed_count > 0) {
                    message += `，${data.already_confirmed_count} 个已确认`;
                }
                alert(message);
                
                // 立即更新所有已确认课程的行样式，不刷新页面
                selectedIds.forEach(courseId => {
                    // 检查当前状态，只更新未确认的课程
                    const checkbox = document.querySelector(`input.course-checkbox[value="${courseId}"]`);
                    if (checkbox) {
                        const row = checkbox.closest('tr');
                        if (row) {
                            const confirmBtn = row.querySelector('button[onclick*="confirmCourseForAllCourses"]');
                            // 如果按钮显示"确认上课"，说明未确认，需要更新为已确认
                            if (confirmBtn && confirmBtn.textContent.includes('确认上课')) {
                                updateCourseConfirmButtonForAllCourses(courseId, true);
                                
                                // 更新本地数据
                                const course = allCoursesAllData.find(c => c.id === courseId);
                                if (course) {
                                    course.is_confirmed = true;
                                }
                            }
                        }
                    }
                });
                
                // 更新批量删除按钮状态
                if (typeof updateBatchDeleteButton === 'function') {
                    updateBatchDeleteButton();
                }
                
                // 通知其他标签页刷新
                notifyOtherTabsToRefresh();
            })
            .catch(err => {
                console.error('批量确认失败:', err);
                alert('批量确认失败：' + (err.message || '未知错误'));
            });
        }

        // 批量删除
        function batchDeleteCourses() {
            console.log('batchDeleteCourses 函数被调用');
            const checkboxes = document.querySelectorAll('.course-checkbox:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            
            if (selectedIds.length === 0) {
                alert('请先选择要删除的排课');
                return;
            }
            
            if (!confirm(`确定要删除选中的 ${selectedIds.length} 条排课吗？`)) {
                return;
            }
            
            let successCount = 0;
            let failCount = 0;
            const promises = selectedIds.map(id => {
                return fetch(`/api/courses/${id}`, { method: 'DELETE' })
                    .then(response => {
                        return response.json().then(data => {
                            if (response.ok) {
                                successCount++;
                            } else {
                                failCount++;
                                console.error(`删除排课 ${id} 失败:`, data.error || '未知错误');
                            }
                        });
                    })
                    .catch(err => {
                        console.error('删除排课失败:', err);
                        failCount++;
                    });
            });
            
            Promise.all(promises).then(() => {
                alert(`批量删除完成！成功：${successCount}条，失败：${failCount}条`);
                refreshAllCoursesData();
                // 通知其他标签页刷新
                notifyOtherTabsToRefresh();
            });
        }

        function saveCourseForAllCourses(e, id) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            // 确保数字字段转换为数字类型
            if (data.student_id) data.student_id = parseInt(data.student_id);
            if (data.teacher_id) data.teacher_id = parseInt(data.teacher_id);
            if (data.course_id) data.course_id = parseInt(data.course_id);
            
            // 不包含 is_confirmed 字段，确认上课状态只能通过确认/取消确认按钮修改
            // 如果 data 中有 is_confirmed，删除它
            delete data.is_confirmed;
            
            fetch(`/api/courses/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.error) {
                    throw new Error(result.error || '更新失败');
                }
                if (typeof closeModal === 'function') {
                    closeModal();
                }
                // 延迟刷新，确保模态框关闭动画完成
                setTimeout(() => {
                    refreshAllCoursesData();
                    // 通知其他标签页刷新
                    notifyOtherTabsToRefresh();
                }, 300);
            })
            .catch(err => {
                console.error('保存排课失败:', err);
                alert('保存失败: ' + (err.message || '未知错误'));
            });
        }

        // 确认/取消确认课程（用于全部排课页面）
        function confirmCourseForAllCourses(courseId) {
            // 检查当前课程是否已确认（通过查找按钮文本来判断）
            const checkbox = document.querySelector(`input.course-checkbox[value="${courseId}"]`);
            let isConfirmed = false;
            let studentId = null;
            let courseIdForCheck = null;
            
            if (checkbox) {
                const row = checkbox.closest('tr');
                if (row) {
                    const confirmBtn = row.querySelector('button[onclick*="confirmCourseForAllCourses"]');
                    isConfirmed = confirmBtn && confirmBtn.textContent.includes('取消确认');
                    
                    // 从课程数据中获取学生ID和课程ID
                    const course = allCoursesAllData.find(c => c.id === courseId);
                    if (course) {
                        studentId = course.student_id;
                        courseIdForCheck = course.course_id;
                    }
                }
            }
            
            // 如果是确认上课（不是取消确认），检查剩余课时
            if (!isConfirmed && studentId && courseIdForCheck) {
                // 获取提醒课时阈值配置值（如果未加载，使用默认值3）
                const reminderThreshold = window.minHoursForReminder !== undefined ? window.minHoursForReminder : 3;
                
                // 从全局剩余课时映射中获取剩余课时
                const key = `${studentId}-${courseIdForCheck}`;
                let remainingHours = null;
                
                if (window.remainingHoursMap && window.remainingHoursMap[key] !== undefined) {
                    remainingHours = window.remainingHoursMap[key];
                    
                    // 如果剩余课时等于或低于提醒阈值，提示缴费
                    if (remainingHours <= reminderThreshold) {
                        if (!confirm(`⚠️ 警告：该学生剩余课时为${remainingHours}，低于或等于提醒阈值${reminderThreshold}。确认上课后将剩余${remainingHours - 1}课时。\n\n建议先缴费再确认上课，是否继续确认？`)) {
                            return;
                        }
                    }
                } else {
                    // 如果全局映射中没有，尝试从API查询
                    const today = new Date();
                    const month = today.toISOString().slice(0, 7);
                    
                    fetch(`/api/stats?month=${month}&student_id=${studentId}&course_id=${courseIdForCheck}`)
                        .then(res => res.json())
                        .then(stats => {
                            const reminderThreshold = window.minHoursForReminder !== undefined ? window.minHoursForReminder : 3;
                            
                            if (stats && stats.length > 0) {
                                const stat = stats.find(s => s.student_id == studentId && s.course_id == courseIdForCheck);
                                if (stat) {
                                    remainingHours = stat.remaining_hours || 0;
                                    
                                    if (remainingHours <= reminderThreshold) {
                                        if (!confirm(`⚠️ 警告：该学生剩余课时为${remainingHours}，低于或等于提醒阈值${reminderThreshold}。确认上课后将剩余${remainingHours - 1}课时。\n\n建议先缴费再确认上课，是否继续确认？`)) {
                                            return;
                                        }
                                    }
                                }
                            }
                            
                            // 执行确认操作
                            performConfirmCourseForAllCourses(courseId, isConfirmed);
                        })
                        .catch(err => {
                            console.error('查询剩余课时失败:', err);
                            // 查询失败，直接确认
                            performConfirmCourseForAllCourses(courseId, isConfirmed);
                        });
                    return; // 异步查询，先返回
                }
            }
            
            // 执行确认操作
            performConfirmCourseForAllCourses(courseId, isConfirmed);
        }
        
        // 执行确认课程操作（用于全部排课页面）
        function performConfirmCourseForAllCourses(courseId, isConfirmed) {
            const message = isConfirmed 
                ? '确定要取消确认该课程吗？取消后将恢复剩余课时。' 
                : '确认该课程已上课？确认后将扣除剩余课时。';
            
            if (!confirm(message)) return;
            
            fetch(`/api/courses/${courseId}/confirm`, { method: 'POST' })
                .then(res => res.json())
                .then((data) => {
                    if (data.error) {
                        alert('操作失败: ' + data.error);
                        return;
                    }
                    // 立即更新按钮状态和行样式，不刷新页面
                    updateCourseConfirmButtonForAllCourses(courseId, !isConfirmed);
                    
                    // 更新本地数据
                    const course = allCoursesAllData.find(c => c.id === courseId);
                    if (course) {
                        course.is_confirmed = !isConfirmed;
                    }
                    
                    // 更新按钮状态
                    if (typeof updateBatchDeleteButton === 'function') {
                        updateBatchDeleteButton();
                    }
                    
                    // 通知其他标签页刷新
                    notifyOtherTabsToRefresh();
                })
                .catch(err => {
                    console.error('操作失败:', err);
                    alert('操作失败：' + (err.message || '未知错误'));
                });
        }
        
        // 更新课程确认按钮状态（用于全部排课页面）
        function updateCourseConfirmButtonForAllCourses(courseId, newIsConfirmed) {
            const checkbox = document.querySelector(`input.course-checkbox[value="${courseId}"]`);
            if (!checkbox) return;
            
            const row = checkbox.closest('tr');
            if (row) {
                const confirmBtn = row.querySelector('button[onclick*="confirmCourseForAllCourses"]');
                if (confirmBtn) {
                    if (newIsConfirmed) {
                        confirmBtn.textContent = '取消确认';
                        confirmBtn.className = 'btn btn-secondary';
                        confirmBtn.style.background = '#6c757d';

                        row.style.backgroundColor = '#f5f5f5';
                        row.style.color = '#666';
                        row.style.opacity = '0.8';
                    } else {
                        confirmBtn.textContent = '确认上课';
                        confirmBtn.className = 'btn btn-success';
                        confirmBtn.style.background = '#28a745';
                        confirmBtn.style.color = 'white';
                        // 恢复行样式为正常
                        row.style.backgroundColor = '';
                        row.style.color = '';
                        row.style.opacity = '';
                    }
                    console.log('已更新确认按钮和行样式，ID:', courseId, '新状态:', newIsConfirmed);
                }
            }
        }

        // 重写 showAddCourseModal 以在保存后刷新全部排课页面
        // 确保在页面加载完成后才重写，避免覆盖问题
        function setupSaveCourseHandler() {
            console.log('设置 saveCourse 处理器');
            const originalShowAddCourseModal = window.showAddCourseModal;
            const originalSaveCourse = window.saveCourse;
            
            if (originalShowAddCourseModal) {
                window.showAddCourseModal = function() {
                    console.log('showAddCourseModal 被调用（all_courses 版本）');
                    if (originalShowAddCourseModal) {
                        originalShowAddCourseModal();
                    }
                };
                console.log('✓ showAddCourseModal 已重写');
            } else {
                console.warn('⚠ originalShowAddCourseModal 未找到');
            }
            
            // 重写 saveCourse 以在保存后刷新全部排课页面
            if (originalSaveCourse) {
                window.saveCourse = function(e, id) {
                    console.log('saveCourse 被调用（all_courses 版本），id:', id);
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const data = Object.fromEntries(formData);
                    
                    // 如果是新增排课，检查冲突
                    if (!id && data.course_date && data.time_slot && data.teacher_id && data.student_id) {
                        const submitBtn = document.getElementById('course-submit-btn');
                        if (submitBtn && submitBtn.disabled) {
                            alert('存在课程冲突，无法保存。请修改排课信息后再试。');
                            return;
                        }
                    }
                    
                    // 创建 Promise 来处理保存操作
                    const savePromise = new Promise((resolve, reject) => {
                        if (id) {
                            // 更新状态
                            fetch(`/api/courses/${id}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            })
                            .then(async response => {
                                const result = await response.json();
                                if (!response.ok) {
                                    throw new Error(result.error || '更新失败');
                                }
                                closeModal();
                                resolve(result);
                            })
                            .catch(reject);
                        } else {
                            // 创建新排课前检查剩余课时
                            const studentSelect = document.getElementById('course-student-select');
                            if (studentSelect && studentSelect.value) {
                                const selectedOption = studentSelect.options[studentSelect.selectedIndex];
                                const remainingHours = parseFloat(selectedOption.getAttribute('data-remaining-hours')) || 0;
                                const schedulingThreshold = window.minHoursForScheduling !== undefined ? window.minHoursForScheduling : -1.0;
                                
                                if (remainingHours < schedulingThreshold) {
                                    alert(`无法排课！学生剩余课时为 ${remainingHours}，低于 ${schedulingThreshold}。请先缴费！`);
                                    reject(new Error('剩余课时不足'));
                                    return;
                                }
                            }
                            
                            // 创建新排课
                            fetch('/api/courses', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            })
                            .then(async res => {
                                const result = await res.json();
                                if (!res.ok) {
                                    if (result.conflicts && result.conflicts.length > 0) {
                                        const conflictMessages = result.conflicts.map(c => c.message).join('\n');
                                        throw new Error('检测到课程冲突：\n' + conflictMessages);
                                    }
                                    const errorMsg = result.error || result.message || `HTTP ${res.status} 错误`;
                                    const details = result.details ? '\n\n详细信息:\n' + result.details : '';
                                    throw new Error(errorMsg + details);
                                }
                                closeModal();
                                resolve(result);
                            })
                            .catch(err => {
                                console.error('保存排课失败:', err);
                                const errorText = '保存失败：' + err.message;
                                alert(errorText);
                                reject(err);
                            });
                        }
                    });
                    
                    // 保存成功后刷新数据并重新绑定函数
                    savePromise.then(() => {
                        console.log('saveCourse 成功，准备刷新数据');
                        // 延迟一下确保模态框已关闭
                        setTimeout(() => {
                            console.log('开始刷新数据');
                            if (typeof refreshAllCoursesData === 'function') {
                                refreshAllCoursesData();
                            } else if (typeof loadAllCourses === 'function') {
                                refreshAllCoursesData();
                            } else {
                                console.error('refreshAllCoursesData 函数不可用');
                                // 如果 refreshAllCoursesData 不可用，手动重新绑定
                                if (typeof rebindAllFunctions === 'function') {
                                    rebindAllFunctions();
                                }
                            }
                            // 通知其他标签页刷新
                            notifyOtherTabsToRefresh();
                        }, 500); // 增加延迟时间，确保模态框完全关闭
                    }).catch((err) => {
                        console.error('saveCourse 失败:', err);
                    });
                    
                    return savePromise;
                };
                console.log('✓ saveCourse 已重写（返回 Promise）');
            } else {
                console.warn('⚠ originalSaveCourse 未找到');
            }
        }
        
        // 重新绑定所有函数到全局作用域（在数据刷新后调用）

        // 立即绑定到全局作用域

        // 页面加载完成后设置处理器

        window.batchDeleteCourses = batchDeleteCourses;
        
        // 显示统计信息
        function showStatistics() {
            console.log('showStatistics 函数被调用');
            // 获取当前筛选条件下的所有数据
            const params = [];
            params.push(`page=1`);
            params.push(`per_page=10000`); // 获取足够多的数据用于统计
            
            // 添加筛选参数
            const filterStudentName = document.getElementById('filter-student-name').value;
            const filterTeacher = document.getElementById('filter-teacher').value;
            const filterSubject = document.getElementById('filter-subject').value;
            const filterGrade = document.getElementById('filter-grade').value;
            const filterDateStart = document.getElementById('filter-date-start').value;
            const filterDateEnd = document.getElementById('filter-date-end').value;
            const filterStatus = document.getElementById('filter-status').value;
            const filterOrderBy = document.getElementById('filter-order-by').value || 'desc';
            
            if (filterStudentName) {
                params.push(`student_name=${encodeURIComponent(filterStudentName)}`);
            }
            if (filterTeacher) {
                params.push(`teacher=${encodeURIComponent(filterTeacher)}`);
            }
            if (filterSubject) {
                params.push(`subject=${encodeURIComponent(filterSubject)}`);
            }
            if (filterGrade) {
                params.push(`grade=${encodeURIComponent(filterGrade)}`);
            }
            if (filterDateStart) {
                params.push(`date_start=${encodeURIComponent(filterDateStart)}`);
            }
            if (filterDateEnd) {
                params.push(`date_end=${encodeURIComponent(filterDateEnd)}`);
            }
            if (filterStatus) {
                params.push(`status=${encodeURIComponent(filterStatus)}`);
            }
            // 添加排序参数
            params.push(`order_by=${encodeURIComponent(filterOrderBy)}`);
            
            const url = '/api/all_courses?' + params.join('&');
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const courses = data.courses || [];
                    const total = data.total || 0;
                    
                    // 统计信息
                    const stats = {
                        total: total,
                        confirmed: 0,
                        unconfirmed: 0,
                        byStatus: { '正常': 0, '请假': 0, '跑空': 0 },
                        bySubject: {},
                        byTeacher: {},
                        byGrade: {}
                    };
                    
                    courses.forEach(course => {
                        // 确认状态统计
                        if (course.is_confirmed) {
                            stats.confirmed++;
                        } else {
                            stats.unconfirmed++;
                        }
                        
                        // 状态统计
                        const status = course.status || '正常';
                        if (stats.byStatus[status] !== undefined) {
                            stats.byStatus[status]++;
                        }
                        
                        // 科目统计
                        const subject = course.subject || '未知';
                        stats.bySubject[subject] = (stats.bySubject[subject] || 0) + 1;
                        
                        // 老师统计
                        const teacher = course.teacher_name || '未知';
                        stats.byTeacher[teacher] = (stats.byTeacher[teacher] || 0) + 1;
                        
                        // 年级统计
                        const grade = course.grade || '未知';
                        stats.byGrade[grade] = (stats.byGrade[grade] || 0) + 1;
                    });
                    
                    // 构建统计信息HTML
                    let statsHtml = `
                        <h2>排课统计信息</h2>
                        <div style="margin-top: 20px;">
                            <h3>总体统计</h3>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">总记录数</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${stats.total}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">已确认</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${stats.confirmed}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">未确认</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${stats.unconfirmed}</td>
                                </tr>
                            </table>
                            
                            <h3>按状态统计</h3>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                                <tr>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">状态</th>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">数量</th>
                                </tr>
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd;">正常</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${stats.byStatus['正常']}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd;">请假</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${stats.byStatus['请假']}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd;">跑空</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${stats.byStatus['跑空']}</td>
                                </tr>
                            </table>
                            
                            <h3>按科目统计（前10名）</h3>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                                <tr>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">科目</th>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">数量</th>
                                </tr>
                    `;
                    
                    // 按数量排序并显示前10名
                    const subjectEntries = Object.entries(stats.bySubject)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 10);
                    
                    subjectEntries.forEach(([subject, count]) => {
                        statsHtml += `
                            <tr>
                                <td style="padding: 8px; border: 1px solid #ddd;">${subject}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${count}</td>
                            </tr>
                        `;
                    });
                    
                    statsHtml += `
                            </table>
                            
                            <h3>按老师统计（前10名）</h3>
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                                <tr>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">老师</th>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">数量</th>
                                </tr>
                    `;
                    
                    // 按数量排序并显示前10名
                    const teacherEntries = Object.entries(stats.byTeacher)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 10);
                    
                    teacherEntries.forEach(([teacher, count]) => {
                        statsHtml += `
                            <tr>
                                <td style="padding: 8px; border: 1px solid #ddd;">${teacher}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${count}</td>
                            </tr>
                        `;
                    });
                    
                    statsHtml += `
                            </table>
                            
                            <h3>按年级统计</h3>
                            <table style="width: 100%; border-collapse: collapse;">
                                <tr>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">年级</th>
                                    <th style="padding: 8px; border: 1px solid #ddd; background: #f5f5f5;">数量</th>
                                </tr>
                    `;
                    
                    // 按数量排序
                    const gradeEntries = Object.entries(stats.byGrade)
                        .sort((a, b) => b[1] - a[1]);
                    
                    gradeEntries.forEach(([grade, count]) => {
                        statsHtml += `
                            <tr>
                                <td style="padding: 8px; border: 1px solid #ddd;">${grade}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${count}</td>
                            </tr>
                        `;
                    });
                    
                    statsHtml += `
                            </table>
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                            <button type="button" class="btn btn-primary" onclick="closeModal()">关闭</button>
                        </div>
                    `;
                    
                    if (typeof showModal === 'function') {
                        showModal(statsHtml);
                    } else {
                        alert('showModal 函数未定义');
                    }
                })
                .catch(error => {
                    console.error('获取统计数据失败:', error);
                    alert('获取统计数据失败: ' + error.message);
                    });
        }
        
        // 确保函数在全局作用域可用
        window.showStatistics = showStatistics;
        
        // 确保其他函数也在全局作用域可用（初始绑定）
        // 注意：这些绑定会在所有函数定义完成后执行
        window.renderAllCoursesTable = renderAllCoursesTable;
        window.updateAllCoursesPagination = updateAllCoursesPagination;
        window.coursesPreviousPage = coursesPreviousPage;
        window.coursesNextPage = coursesNextPage;
        window.toggleSelectAll = toggleSelectAll;
        window.updateBatchDeleteButton = updateBatchDeleteButton;
        window.showEditCourseModal = showEditCourseModal;
        window.updateCourseStatus = updateCourseStatus;
        window.confirmCourseForAllCourses = confirmCourseForAllCourses;
        window.deleteCourse = deleteCourse;
        
        // 保存 rebindAllFunctions 函数引用，供后续使用
        window.rebindAllFunctions = rebindAllFunctions;
        
        // 延迟执行初始绑定，确保所有函数都已定义（包括 showStatistics）
        setTimeout(function() {
            console.log('执行初始函数绑定（延迟执行，确保所有函数已定义）');
            rebindAllFunctions();
            
            // 验证关键函数是否可用
            console.log('验证函数绑定结果:');
            console.log('  batchConfirmAllCourses:', typeof window.batchConfirmAllCourses);
            console.log('  batchCancelConfirmAllCourses:', typeof window.batchCancelConfirmAllCourses);
            console.log('  batchDeleteCourses:', typeof window.batchDeleteCourses);
            console.log('  showStatistics:', typeof window.showStatistics);
            console.log('  closeWindowOrGoHome:', typeof window.closeWindowOrGoHome);
        }, 200);
        
        // 调试函数：测试所有按钮函数是否可用
        window.testAllButtons = function() {
            console.log('=== 测试所有按钮函数 ===');
            const functions = [
                'closeWindowOrGoHome',
                'applyFilters',
                'clearFilters',
                'loadAllCourses',
                'batchConfirmAllCourses',
                'batchCancelConfirmAllCourses',
                'batchDeleteCourses',
                'showStatistics',
                'showAddCourseModal',
                'coursesPreviousPage',
                'coursesNextPage',
                'toggleSelectAll',
                'updateBatchDeleteButton',
                'showEditCourseModal',
                'updateCourseStatus',
                'confirmCourseForAllCourses',
                'deleteCourse',
                'renderAllCoursesTable',
                'updateAllCoursesPagination'
            ];
            
            functions.forEach(funcName => {
                const func = window[funcName];
                if (typeof func === 'function') {
                    console.log(`✓ ${funcName}: 可用`);
                } else {
                    console.error(`✗ ${funcName}: 不可用`);
                }
            });
            
            console.log('=== 测试完成 ===');
            console.log('提示：如果函数不可用，请检查脚本加载顺序或函数定义');
        };
        
        // 页面加载完成后自动测试
        window.addEventListener('load', function() {
            console.log('=== 页面加载完成，测试按钮函数 ===');
            setTimeout(function() {
                if (typeof window.testAllButtons === 'function') {
                    window.testAllButtons();
                }
            }, 1000);
        });
        
        // 页面完全加载后的最终检查（确保数据已显示）
        window.addEventListener('load', function() {
            console.log('=== window.load 事件触发 ===');
            setTimeout(function() {
                const tbody = document.getElementById('courses-table-body');
                if (tbody) {
                    const rows = tbody.querySelectorAll('tr');
                    console.log('最终检查 - tbody子元素数:', tbody.children.length, 'tr数量:', rows.length);
                    if (rows.length === 0 && allCoursesAllData.length > 0) {
                        console.error('最终检查失败：数据存在但页面未显示！');
                        console.error('数据数量:', allCoursesAllData.length);
                        console.error('tbody子元素数:', tbody.children.length);
                        // 最后一次尝试渲染
                        console.log('最后一次尝试渲染...');
                        tbody.innerHTML = '';
                        allCoursesAllData.forEach((course, index) => {
                            const tr = document.createElement('tr');
                            const rowNum = index + 1;
                            const courseDate = course.course_date ? new Date(course.course_date + 'T00:00:00') : null;
                            const dateStr = courseDate ? `${courseDate.getFullYear()}-${String(courseDate.getMonth() + 1).padStart(2, '0')}-${String(courseDate.getDate()).padStart(2, '0')}` : course.course_date || '';
                            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                            const weekday = courseDate ? weekdays[courseDate.getDay()] : (course.weekday || '');
                            tr.innerHTML = `
                                <td><input type="checkbox" class="course-checkbox" value="${course.id}"></td>
                                <td>${rowNum}</td>
                                <td>${course.student_name || ''}</td>
                                <td>${course.grade || ''}</td>
                                <td>${course.subject || ''}</td>
                                <td>${course.course_name || course.subject || ''}</td>
                                <td>${course.teacher_name || ''}</td>
                                <td>${dateStr}</td>
                                <td>${weekday}</td>
                                <td>${course.time_slot || ''}</td>
                                <td>
                                    <select onchange="updateCourseStatus(${course.id}, this.value)" style="padding: 4px; border: 1px solid #ddd; border-radius: 4px;">
                                        <option value="正常" ${course.status === '正常' ? 'selected' : ''}>正常</option>
                                        <option value="请假" ${course.status === '请假' ? 'selected' : ''}>请假</option>
                                        <option value="跑空" ${course.status === '跑空' ? 'selected' : ''}>跑空</option>
                                    </select>
                                </td>
                                <td>
                                    ${course.is_confirmed ? 
                                        '<button class="btn btn-secondary" onclick="confirmCourseForAllCourses(' + course.id + ')" style="background: #6c757d; color: white; padding: 4px 8px; font-size: 12px;">取消确认</button>' : 
                                        '<button class="btn btn-success" onclick="confirmCourseForAllCourses(' + course.id + ')" style="background: #28a745; color: white; padding: 4px 8px; font-size: 12px;">确认上课</button>'
                                    }
                                </td>
                                <td>
                                    ${(!course.is_confirmed || (currentUserRole === 'admin')) ? 
                                        '<button class="btn btn-sm btn-primary" onclick="showEditCourseModal(' + course.id + ')">编辑</button>' :
                                        '<button class="btn btn-sm btn-primary" disabled style="opacity: 0.5;">编辑</button>'
                                    }
                                    ${(!course.is_confirmed || (currentUserRole === 'admin')) ? 
                                        '<button class="btn btn-sm btn-danger" onclick="deleteCourse(' + course.id + ')">删除</button>' :
                                        '<button class="btn btn-sm btn-danger" disabled style="opacity: 0.5;">删除</button>'
                                    }
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                        const pageInfo = document.getElementById('courses-page-info');
                        if (pageInfo) {
                            pageInfo.textContent = `第 1 页，共 ${allCoursesTotalPages} 页（共 ${allCoursesTotal} 条记录）`;
                        }
                        console.log('最后一次渲染完成，tbody子元素数:', tbody.children.length);
                    }
                }
            }, 1000);
        });
        
        // 页面完全加载后的最终检查
        window.addEventListener('load', function() {
            console.log('=== window.load 事件触发 ===');
            setTimeout(function() {
                const tbody = document.getElementById('courses-table-body');
                if (tbody) {
                    const rows = tbody.querySelectorAll('tr');
                    const stillLoading = tbody.textContent.includes('正在加载数据');
                    
                    console.log('最终检查 - tbody子元素数:', tbody.children.length);
                    console.log('tr数量:', rows.length);
                    console.log('是否仍在加载:', stillLoading);
                    console.log('数据数量:', allCoursesAllData.length);
                    
                    if (stillLoading && allCoursesAllData.length === 0) {
                        console.error('✗✗✗ 最终检查失败：页面仍在显示"正在加载数据"，但数据未加载 ✗✗✗');
                        console.error('尝试最后一次加载数据...');
                        
                        // 最后一次尝试加载数据
                        if (typeof loadAllCourses === 'function') {
                            console.log('执行最后一次 loadAllCourses');
                            loadAllCourses();
                        } else {
                            console.error('loadAllCourses 函数不可用');
                            tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: red; font-weight: bold;">数据加载失败：loadAllCourses 函数不可用<br>请刷新页面重试<br><button onclick="location.reload()" style="margin-top: 10px; padding: 5px 15px;">刷新页面</button></td></tr>';
                        }
                    } else if (rows.length > 0) {
                        console.log('✓ 最终检查通过：数据已显示');
                    }
                }
            }, 2000); // 2秒后检查
        });
    </script>
</body>
</html>
